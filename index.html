    const o = ctx.createOscillator(), g = ctx.createGain();
    o.connect(g); g.connect(dest); o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(vol, t); g.gain.setValueAtTime(vol*0.7, t+dur*0.65);
    g.gain.linearRampToValueAtTime(0, t+dur); o.start(t); o.stop(t+dur+0.005);
}
function _bgmKick(ctx, dest, t) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.connect(g); g.connect(dest); o.type = 'sine';
    o.frequency.setValueAtTime(160, t); o.frequency.exponentialRampToValueAtTime(38, t+0.1);
    g.gain.setValueAtTime(0.32, t); g.gain.exponentialRampToValueAtTime(0.001, t+0.13);
    o.start(t); o.stop(t+0.14);
}
function _bgmSnare(ctx, dest, t) {
    const src = ctx.createBufferSource(), flt = ctx.createBiquadFilter(), g = ctx.createGain();
    src.buffer = _bgmNoiseBuffer(ctx);
    src.connect(flt); flt.connect(g); g.connect(dest);
    flt.type = 'bandpass'; flt.frequency.value = 2800; flt.Q.value = 0.8;
    g.gain.setValueAtTime(0.18, t); g.gain.exponentialRampToValueAtTime(0.001, t+0.08);
    src.start(t); src.stop(t+0.09);
}
function _bgmHat(ctx, dest, t) {
    const src = ctx.createBufferSource(), flt = ctx.createBiquadFilter(), g = ctx.createGain();
    src.buffer = _bgmNoiseBuffer(ctx);
    src.connect(flt); flt.connect(g); g.connect(dest);
    flt.type = 'highpass'; flt.frequency.value = 9000;
    g.gain.setValueAtTime(0.022, t); g.gain.exponentialRampToValueAtTime(0.001, t+0.022);
    src.start(t); src.stop(t+0.025);
}
function _bgmLoop() {
    if (!_bgmActive) return;
    try {
        const ctx = _getActx(), dest = _bgmGainNode(ctx), now = ctx.currentTime, e = _BGM_E;
        _BGM_MEL.forEach((f,i)  => _bgmNote(ctx, dest, f, now+i*e, e*0.82));
        _BGM_BASS.forEach((f,i) => _bgmNote(ctx, dest, f, now+i*e, e*1.5, 0.06));
        for (let i = 0; i < 16; i++) {
            const t = now + i*e;
            if (i%4===0) _bgmKick(ctx, dest, t);
            else if (i%4===2) _bgmSnare(ctx, dest, t);
            _bgmHat(ctx, dest, t);
        }
        _bgmTimer = setTimeout(_bgmLoop, (16*e - 0.08)*1000);
    } catch(e2) {}
}
function startBattleMusic() {
    if (_bgmActive) return;
    _bgmActive = true;
    try {
        const ctx = _getActx(), g = _bgmGainNode(ctx), now = ctx.currentTime;
        g.gain.cancelScheduledValues(now); g.gain.setValueAtTime(0, now);
        g.gain.linearRampToValueAtTime(0.5, now + 0.6);
    } catch(e) {}
    _bgmLoop();
}
function stopBattleMusic() {
    _bgmActive = false;
    clearTimeout(_bgmTimer); _bgmTimer = null;
    try {
        const ctx = _getActx(), g = _bgmGainNode(ctx), now = ctx.currentTime;
        g.gain.cancelScheduledValues(now); g.gain.setValueAtTime(g.gain.value, now);
        g.gain.linearRampToValueAtTime(0, now + 0.5);
    } catch(e) {}
}

function kiwimonMass(rad) {
    // Exponential mass scale: 1.5 kg at rad=0, each unit ≈ ×10,000
    const kg = rad <= 0 ? 1.5 : 1.5 * Math.pow(10, rad * 4);
    const S = 1.989e30, E = 5.972e24, J = 1.898e27; // solar, earth, jupiter mass in kg
    if (kg < 1e3)        return `${kg.toFixed(1)} kg`;
    if (kg < 1e6)        return `${(kg/1e3).toFixed(1)} t`;
    if (kg < 1e9)        return `${(kg/1e6).toFixed(1)} kt`;
    if (kg < 1e12)       return `${(kg/1e9).toFixed(1)} Mt  ☄ asteroid class`;
    if (kg < E * 0.01)   return `${(kg/1e12).toFixed(1)} Gt  ☄ dwarf planet`;
    if (kg < E)          return `${(kg/E*100).toFixed(3)}% M⊕  🌍 sub-planetary`;
    if (kg < J)          return `${(kg/E).toFixed(2)} M⊕  🌍 planetary`;
    if (kg < S * 0.08)   return `${(kg/J).toFixed(3)} MJ  🪐 gas giant`;
    if (kg < S * 0.5)    return `${(kg/S).toFixed(4)} M☉  🌟 sub-stellar`;
    if (kg < S * 3)      return `${(kg/S).toFixed(3)} M☉  ★ stellar`;
    if (kg < S * 25)     return `${(kg/S).toFixed(1)} M☉  ⚫ stellar BH`;
    if (kg < S * 1e4)    return `${(kg/S).toExponential(2)} M☉  ⚫ intermediate BH`;
    if (kg < S * 1e7)    return `${(kg/S/1e6).toFixed(3)}×10⁶ M☉  ⚫ supermassive BH`;
    if (kg < S * 1e10)   return `${(kg/S/1e9).toFixed(2)}×10⁹ M☉  ⚫ quasar`;
    return                `${(kg/S/1e12).toFixed(1)}×10¹² M☉  ⚫ COSMIC GOD`;
}

function showLeaderboard() {
    const pts = ufoScore * 100 + (ufoWave + 1) * 500 + cakesEatenTotal * 50 + preBattleCombo * 10;
    const mass = kiwimonMass(cakesEatenTotal * 0.1);
    let scores = [];
    try { scores = JSON.parse(localStorage.getItem('kiwimon_lb') || '[]'); } catch(e) {}
    const entry = { score: pts, ufos: ufoScore, waves: ufoWave + 1, cakes: cakesEatenTotal, combo: preBattleCombo, mass };
    scores.push(entry);
    scores.sort((a, b) => b.score - a.score);
    const rank = scores.indexOf(entry) + 1;
    scores = scores.slice(0, 5);
    try { localStorage.setItem('kiwimon_lb', JSON.stringify(scores)); } catch(e) {}
    const lbEl = document.getElementById('leaderboard');
    lbEl.innerHTML = `
        <button class="lb-close" onclick="hideLeaderboard()">✕</button>
        <h2>⚡ BATTLE RESULTS ⚡</h2>
        <div class="lb-cur">
            <div class="lb-rank-tag">${rank === 1 ? '🏆 NEW RECORD!' : `RANK #${rank}`}</div>
            <div class="lb-score-big">${pts.toLocaleString()} PTS</div>
            <div class="lb-stat"><span>WAVES SURVIVED</span><span>${ufoWave + 1}</span></div>
            <div class="lb-stat"><span>ENEMIES DEFEATED</span><span>${ufoScore}</span></div>
            <div class="lb-stat"><span>CAKES FED</span><span>${cakesEatenTotal}</span></div>
            <div class="lb-stat"><span>PRE-BATTLE COMBO</span><span>×${preBattleCombo}</span></div>
            <div class="lb-stat" style="margin-top:7px;padding-top:7px;border-top:1px solid #ff44ff22">
                <span style="color:#00ffcc">KIWIMON FINAL MASS</span>
                <span style="color:#00ffcc;text-shadow:0 0 8px #00ffcc">${mass}</span>
            </div>
        </div>
        <div class="lb-sec">TOP SCORES</div>
        ${scores.map((r, i) => `
            <div class="lb-row${i === rank - 1 && rank <= 5 ? ' you' : ''}">
                <span class="lb-pos">${['🥇','🥈','🥉','4.','5.'][i]}</span>
                <span class="lb-pts">${r.score.toLocaleString()}</span>
                <span class="lb-detail" style="flex:none">${r.mass ? r.mass.split('  ')[0] : `${r.cakes}🍰`}</span>
                ${i === rank - 1 && rank <= 5 ? '<span class="lb-you-tag">YOU</span>' : ''}
            </div>`).join('')}
    `;
    lbEl.classList.add('visible');
}

function hideLeaderboard() {
    document.getElementById('leaderboard').classList.remove('visible');
}

// intro digivolution burst after 1.5s
setTimeout(() => triggerBurst(), 1500);

</script>
