<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Kiwimon Digivolution</title>
<style>
html,body{
    margin:0;overflow:hidden;
    background:#120c00;
    font-family:'Courier New',monospace;
    cursor:crosshair;user-select:none;
}
canvas{display:block;}

#flash{
    position:fixed;inset:0;
    background:radial-gradient(ellipse at center,#ffffff 0%,#ff88ff 35%,transparent 80%);
    opacity:0;pointer-events:none;z-index:99;
}

#title{
    position:absolute;top:25px;width:100%;text-align:center;
    color:#7df9ff;font-size:28px;letter-spacing:6px;
    text-shadow:0 0 8px #00ffff,0 0 18px #ff00ff;
    pointer-events:none;
}

#hint{
    position:absolute;top:68px;width:100%;text-align:center;
    color:#7df9ff55;font-size:11px;letter-spacing:3px;
    pointer-events:none;opacity:0;transition:opacity 1.2s;
}

#status{
    position:absolute;bottom:88px;width:100%;text-align:center;
    color:#ff8ef5;font-size:13px;letter-spacing:3px;opacity:.85;
    pointer-events:none;
}

#energy-bar{
    position:absolute;bottom:68px;left:50%;transform:translateX(-50%);
    width:220px;height:6px;
    border:1px solid #7df9ff55;border-radius:3px;overflow:hidden;
    box-shadow:0 0 8px #00ffff33;
}

#energy-fill{
    height:100%;width:98%;
    background:linear-gradient(90deg,#00ffff,#ff00ff);
    transition:width .6s,box-shadow .3s;
}

#btn{
    position:absolute;bottom:22px;left:50%;transform:translateX(-50%);
    background:transparent;border:1px solid #ff44ff;
    color:#ff44ff;font-family:'Courier New',monospace;
    font-size:12px;letter-spacing:4px;padding:7px 22px;
    cursor:pointer;text-shadow:0 0 8px #ff00ff;
    box-shadow:0 0 12px #ff00ff44;
    transition:all .25s;outline:none;
}
#btn:hover{background:#ff00ff22;box-shadow:0 0 24px #ff00ffaa;letter-spacing:6px;}
#btn:active{transform:translateX(-50%) scale(.95);}

#combo{
    position:absolute;top:50%;left:50%;
    transform:translate(-50%,-50%) translateY(-90px);
    color:#ffff44;font-size:44px;font-weight:bold;
    letter-spacing:3px;
    text-shadow:0 0 20px #ffff00,0 0 50px #ff8800;
    pointer-events:none;opacity:0;transition:opacity .3s;
}

#ufo-hud{
    position:absolute;top:110px;width:100%;text-align:center;
    pointer-events:none;opacity:0;transition:opacity .5s;
}
#ufo-countdown{
    color:#ff4400;font-size:44px;font-weight:bold;letter-spacing:4px;
    text-shadow:0 0 20px #ff4400,0 0 50px #ff8800;line-height:1;
}
#ufo-score{
    color:#00ffcc;font-size:13px;letter-spacing:3px;margin-top:6px;
    text-shadow:0 0 8px #00ffcc;
}
#feed-instruct{
    position:absolute;top:53%;width:100%;text-align:center;
    color:#ffcc00;font-size:14px;letter-spacing:3px;
    text-shadow:0 0 12px #ffcc00;
    pointer-events:none;opacity:0;transition:opacity .6s;
}

#cake-pile{
    position:absolute;left:14px;top:50%;transform:translateY(-50%);
    display:flex;flex-direction:column-reverse;align-items:center;gap:1px;
    opacity:0;transition:opacity .5s;pointer-events:none;max-height:70vh;overflow:hidden;
}
.cake-icon{font-size:20px;line-height:1.1;filter:drop-shadow(0 0 5px #ffaa00);animation:cakePop .25s ease-out;}
.cake-extra{color:#ffaa00;font-size:11px;letter-spacing:2px;text-shadow:0 0 6px #ffaa00;}
@keyframes cakePop{from{transform:scale(0) rotate(-20deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}

#feed-all-btn{
    position:absolute;left:14px;bottom:22px;
    background:transparent;border:1px solid #ffaa00;
    color:#ffaa00;font-family:'Courier New',monospace;
    font-size:11px;letter-spacing:3px;padding:6px 14px;
    cursor:pointer;text-shadow:0 0 8px #ffaa00;
    box-shadow:0 0 12px #ffaa0044;transition:all .25s;
    opacity:0;pointer-events:none;
}
#feed-all-btn:hover{background:#ffaa0022;box-shadow:0 0 24px #ffaa00aa;}

#bomb-tray{
    position:absolute;right:14px;bottom:70px;
    display:flex;flex-direction:column;gap:7px;align-items:center;
    opacity:0;transition:opacity .5s;
}
.bomb-btn{
    background:transparent;border:1px solid #ff4400;
    color:#ff4400;font-size:24px;width:46px;height:46px;
    cursor:pointer;border-radius:6px;
    text-shadow:0 0 10px #ff4400;box-shadow:0 0 14px #ff440055;
    transition:all .2s;animation:bombPulse 1.6s ease-in-out infinite;
}
.bomb-btn:hover{background:#ff440022;box-shadow:0 0 28px #ff4400cc;transform:scale(1.12);}
@keyframes bombPulse{0%,100%{box-shadow:0 0 14px #ff440055}50%{box-shadow:0 0 28px #ff4400bb,0 0 48px #ff220055;}}
#bomb-label{color:#ff4400;font-size:9px;letter-spacing:2px;text-shadow:0 0 6px #ff4400;margin-top:2px;}

#leaderboard{
    position:absolute;top:50%;left:50%;
    transform:translate(-50%,-50%);
    background:rgba(0,0,0,.91);
    border:1px solid #ff44ff;
    box-shadow:0 0 28px #ff00ff55,0 0 60px #ff00ff22,inset 0 0 20px #ff00ff08;
    color:#7df9ff;font-family:'Courier New',monospace;
    width:min(400px,88vw);padding:22px 26px;
    opacity:0;transition:opacity .9s;pointer-events:none;z-index:50;border-radius:3px;
}
#leaderboard.visible{opacity:1;pointer-events:auto;}
#leaderboard h2{color:#ff44ff;text-align:center;font-size:14px;letter-spacing:5px;
    text-shadow:0 0 12px #ff00ff;margin:0 0 14px;padding-bottom:10px;border-bottom:1px solid #ff44ff33;}
.lb-close{position:absolute;top:10px;right:14px;background:none;border:none;
    color:#ff44ff;font-size:18px;cursor:pointer;line-height:1;padding:2px 6px;
    text-shadow:0 0 8px #ff00ff;transition:color .2s;}
.lb-close:hover{color:#ffffff;}
.lb-cur{background:#ff00ff0a;border:1px solid #ff44ff33;border-radius:3px;padding:10px 14px;margin-bottom:12px;}
.lb-rank-tag{text-align:center;font-size:11px;color:#ff44ff;letter-spacing:3px;margin-bottom:5px;}
.lb-score-big{color:#ffff44;font-size:26px;text-align:center;text-shadow:0 0 14px #ffff00;margin:4px 0 8px;}
.lb-stat{display:flex;justify-content:space-between;font-size:10px;color:#7df9ff55;margin:3px 0;}
.lb-stat span:last-child{color:#7df9ff;}
.lb-sec{font-size:10px;color:#ff44ff;letter-spacing:4px;margin-bottom:6px;}
.lb-row{display:flex;align-items:center;gap:8px;font-size:10px;padding:4px 0;border-bottom:1px solid #ffffff08;}
.lb-row.you{background:#ffff4408;border-radius:2px;padding:4px 4px;}
.lb-pos{width:22px;text-align:center;font-size:13px;}
.lb-pts{color:#ffff44;flex:1;letter-spacing:1px;}
.lb-detail{color:#7df9ff44;font-size:9px;}
.lb-you-tag{color:#00ff88;font-size:9px;letter-spacing:2px;}
</style>
</head>
<body>

<div id="flash"></div>
<div id="title">KIWIMON.EXE</div>
<div id="hint">CLICK · DRAG · SCROLL · [SPACE]</div>
<div id="status">DIGIVOLUTION ENERGY: 98%</div>
<div id="energy-bar"><div id="energy-fill"></div></div>
<button id="btn">⚡ DIGIVOLVE</button>
<div id="combo"></div>
<div id="ufo-hud"><div id="ufo-countdown">10</div><div id="ufo-score"></div></div>
<div id="feed-instruct">DRAG 🍰 TO KIWIMON · CLICK BUTTON WHEN DONE</div>
<div id="cake-pile"></div>
<button id="feed-all-btn">🍰 FEED ALL!!</button>
<div id="bomb-tray"><div id="bomb-label">PLASMA BOMBS</div></div>
<div id="leaderboard"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.168.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.168.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }    from 'three/addons/postprocessing/RenderPass.js';
import { ShaderPass }    from 'three/addons/postprocessing/ShaderPass.js';

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x2e1800, 0.04);

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 0, 8);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

// ── POST-PROCESS: gravitational lens distortion ─────────────────────────────
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));

const lensPass = new ShaderPass({
    uniforms: {
        tDiffuse: { value: null },
        center:   { value: new THREE.Vector2(0.5, 0.5) },
        strength: { value: 0.0 },
        radius:   { value: 0.15 },
        innerR:   { value: 0.06 }  // body exclusion zone — no distortion inside kiwimon
    },
    vertexShader: `
        varying vec2 vUv;
        void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }
    `,
    fragmentShader: `
        uniform sampler2D tDiffuse;
        uniform vec2  center;
        uniform float strength;
        uniform float radius;
        uniform float innerR;
        varying vec2 vUv;
        void main() {
            vec2  delta = vUv - center;
            float dist  = length(delta);
            float pull  = strength * radius / max(dist, 0.003);
            // Outer falloff: zero beyond 4× radius
            float outerFade = smoothstep(radius * 4.0, radius * 0.9, dist);
            // Inner exclusion: zero inside kiwimon body, wider fade zone for large kiwimon
            float innerFade = smoothstep(innerR * 0.75, innerR * 2.0, dist);
            pull *= outerFade * innerFade;
            vec2  dir = delta / max(dist, 0.001);
            // Chromatic aberration: R/G/B bent by slightly different amounts
            float r = texture2D(tDiffuse, clamp(vUv - dir * pull * 1.00, 0.001, 0.999)).r;
            float g = texture2D(tDiffuse, clamp(vUv - dir * pull * 0.97, 0.001, 0.999)).g;
            float b = texture2D(tDiffuse, clamp(vUv - dir * pull * 0.94, 0.001, 0.999)).b;
            gl_FragColor = vec4(r, g, b, 1.0);
        }
    `
});
composer.addPass(lensPass);

// ── LIGHTS ──────────────────────────────────────────────────────────────────

scene.add(new THREE.AmbientLight(0x8888ff, 0.8));

const pinkLight = new THREE.PointLight(0xff44ff, 25);
pinkLight.position.set(5, 3, 5);
scene.add(pinkLight);

const cyanLight = new THREE.PointLight(0x00ffff, 18);
cyanLight.position.set(-5, -2, 4);
scene.add(cyanLight);

// burst lights — normally off
const burstLight = new THREE.PointLight(0xffffff, 0, 24);
scene.add(burstLight);

const burstLight2 = new THREE.PointLight(0xff88ff, 0, 18);
burstLight2.position.y = 3;
scene.add(burstLight2);

// ── STARS ────────────────────────────────────────────────────────────────────

const starVerts = [];
for (let i = 0; i < 3000; i++)
    starVerts.push((Math.random() - .5) * 90, (Math.random() - .5) * 90, (Math.random() - .5) * 90);
const starGeo = new THREE.BufferGeometry();
starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starVerts, 3));
const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: .12 });
const starField = new THREE.Points(starGeo, starMat);
scene.add(starField);

// ── GLOW RINGS ───────────────────────────────────────────────────────────────

const rings = [];
for (let i = 0; i < 3; i++) {
    const r = new THREE.Mesh(
        new THREE.TorusGeometry(2 + i * .35, .022, 8, 64),
        new THREE.MeshBasicMaterial({
            color: i % 2 ? 0xff00ff : 0x00ffff,
            transparent: true, opacity: .45,
            blending: THREE.AdditiveBlending, depthWrite: false
        })
    );
    r.rotation.x = Math.PI / 2;
    r.rotation.z = i * .5;
    scene.add(r);
    rings.push(r);
}

// ── KIWIMON ──────────────────────────────────────────────────────────────────

const kiwi = new THREE.Group();
scene.add(kiwi);
kiwi.scale.setScalar(0.001); // hidden — intro burst reveals it

const bodyMat = new THREE.MeshStandardMaterial({ color: 0x55ff99, flatShading: true, emissive: 0x113322 });
kiwi.add(new THREE.Mesh(new THREE.IcosahedronGeometry(1.4, 0), bodyMat));

const belly = new THREE.Mesh(
    new THREE.IcosahedronGeometry(.9, 0),
    new THREE.MeshStandardMaterial({ color: 0xfff8d7, flatShading: true })
);
belly.scale.set(.65, .75, .4);
belly.position.z = .9;
kiwi.add(belly);

[-0.35, 0.35].forEach(x => {
    const e = new THREE.Mesh(new THREE.IcosahedronGeometry(.12, 0), new THREE.MeshBasicMaterial({ color: 0x000000 }));
    e.position.set(x, .25, 1.2);
    kiwi.add(e);
});

const accentMat = new THREE.MeshStandardMaterial({ color: 0xffb040, flatShading: true });
const beakMesh = new THREE.Mesh(new THREE.ConeGeometry(.18, .45, 4), accentMat);
beakMesh.rotation.x = Math.PI / 2;
beakMesh.position.set(0, -.05, 1.45);
kiwi.add(beakMesh);

[-0.45, 0.45].forEach(x => {
    const f = new THREE.Mesh(new THREE.ConeGeometry(.18, .5, 4), accentMat);
    f.position.set(x, -1.45, .25);
    kiwi.add(f);
});

const crestMat = new THREE.MeshStandardMaterial({ color: 0xff33ff, flatShading: true, emissive: 0x440044 });
for (let i = 0; i < 6; i++) {
    const f = new THREE.Mesh(new THREE.ConeGeometry(.12, .5, 4), crestMat);
    f.position.set(0, 1.15, -0.15 + i * .08);
    f.rotation.x = -.6;
    kiwi.add(f);
}

// ── ENERGY ORBS ──────────────────────────────────────────────────────────────

const orbGroup = new THREE.Group();
scene.add(orbGroup);
for (let i = 0; i < 24; i++) {
    const o = new THREE.Mesh(
        new THREE.OctahedronGeometry(.06),
        new THREE.MeshBasicMaterial({
            color: i % 2 ? 0xff00ff : 0x00ffff,
            blending: THREE.AdditiveBlending, depthWrite: false
        })
    );
    o.userData.angle = (i / 24) * Math.PI * 2;
    o.userData.baseR = 2.5;
    orbGroup.add(o);
}

// ── DIGIVOLUTION LIGHT BEAMS ─────────────────────────────────────────────────

const beams = [];
const beamGroup = new THREE.Group();
scene.add(beamGroup);

for (let i = 0; i < 10; i++) {
    const angle = (i / 10) * Math.PI * 2;
    const r = .7 + Math.random() * .7;
    const h = 20 + Math.random() * 6;
    // narrow at base (near kiwi), wide at top — classic digivolution pillar
    const beam = new THREE.Mesh(
        new THREE.CylinderGeometry(.35 + Math.random() * .25, .03, h, 8, 1, true),
        new THREE.MeshBasicMaterial({
            color: i % 2 ? 0xff44ff : 0x44ffff,
            transparent: true, opacity: 0,
            side: THREE.DoubleSide,
            blending: THREE.AdditiveBlending, depthWrite: false
        })
    );
    beam.position.set(Math.cos(angle) * r, h * .5 - 1.5, Math.sin(angle) * r);
    beams.push(beam);
    beamGroup.add(beam);
}

// ── SHOCKWAVE RINGS ───────────────────────────────────────────────────────────

const shockwaves = [];
[0xffffff, 0xff00ff, 0x00ffff].forEach(color => {
    const sw = new THREE.Mesh(
        new THREE.TorusGeometry(1, .07, 8, 64),
        new THREE.MeshBasicMaterial({
            color, transparent: true, opacity: 0,
            blending: THREE.AdditiveBlending, depthWrite: false
        })
    );
    sw.rotation.x = Math.PI / 2;
    sw.userData = { active: false, t: 0 };
    scene.add(sw);
    shockwaves.push(sw);
});

// ── BURST PARTICLES ───────────────────────────────────────────────────────────

const PCOUNT = 220;
const bPos = new Float32Array(PCOUNT * 3);
const bVel = Array.from({ length: PCOUNT }, () => ({ x: 0, y: 0, z: 0, life: 0 }));
const burstGeo = new THREE.BufferGeometry();
burstGeo.setAttribute('position', new THREE.Float32BufferAttribute(bPos, 3));
const burstMat = new THREE.PointsMaterial({
    size: .14, transparent: true, opacity: 0,
    blending: THREE.AdditiveBlending, depthWrite: false
});
burstMat.color.setHex(0xffffff);
const burstParticles = new THREE.Points(burstGeo, burstMat);
scene.add(burstParticles);

// ── LIGHTNING BOLTS ───────────────────────────────────────────────────────────

const lightGroup = new THREE.Group();
scene.add(lightGroup);

function spawnLightning() {
    const end = new THREE.Vector3((Math.random() - .5) * 7, (Math.random() - .5) * 7, (Math.random() - .5) * 7);
    const pts = [];
    for (let i = 0; i <= 10; i++) {
        const p = new THREE.Vector3().lerpVectors(new THREE.Vector3(), end, i / 10);
        if (i > 0 && i < 10) { p.x += (Math.random() - .5) * .7; p.y += (Math.random() - .5) * .7; p.z += (Math.random() - .5) * .7; }
        pts.push(p);
    }
    const geo = new THREE.BufferGeometry().setFromPoints(pts);
    const mat = new THREE.LineBasicMaterial({
        color: Math.random() > .5 ? 0xffffff : 0xff88ff,
        transparent: true, opacity: 1,
        blending: THREE.AdditiveBlending
    });
    const bolt = new THREE.Line(geo, mat);
    lightGroup.add(bolt);
    setTimeout(() => { lightGroup.remove(bolt); geo.dispose(); mat.dispose(); }, 80 + Math.random() * 120);
}

// ── BLACK HOLE ────────────────────────────────────────────────────────────────

const blackHoleGroup = new THREE.Group();
blackHoleGroup.visible = false;
scene.add(blackHoleGroup);

// event horizon
blackHoleGroup.add(new THREE.Mesh(
    new THREE.SphereGeometry(1.2, 32, 32),
    new THREE.MeshBasicMaterial({ color: 0x000000 })
));

// photon sphere backlit rim
blackHoleGroup.add(new THREE.Mesh(
    new THREE.SphereGeometry(1.38, 32, 32),
    new THREE.MeshBasicMaterial({
        color: 0xff5500, transparent: true, opacity: .65,
        blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.BackSide
    })
));

// accretion disk layers — white core out to deep purple
const diskColors = [0xffffff, 0xffcc44, 0xff5500, 0xcc0088];
const diskRadii  = [1.65, 2.05, 2.55, 3.1];
const diskThicks = [0.16, 0.20, 0.19, 0.14];
const diskSpeeds = [2.1, 1.5, 1.0, 0.6];
const diskMeshes = [];
diskColors.forEach((col, i) => {
    const d = new THREE.Mesh(
        new THREE.TorusGeometry(diskRadii[i], diskThicks[i], 12, 120),
        new THREE.MeshBasicMaterial({
            color: col, transparent: true, opacity: .95 - i * .18,
            blending: THREE.AdditiveBlending, depthWrite: false
        })
    );
    d.rotation.x = Math.PI / 2;
    d.rotation.z = i * .15;
    blackHoleGroup.add(d);
    diskMeshes.push(d);
});

// relativistic jets (north + south poles)
[-1, 1].forEach(dir => {
    const jet = new THREE.Mesh(
        new THREE.CylinderGeometry(dir > 0 ? .22 : .04, dir > 0 ? .04 : .22, 18, 8, 1, true),
        new THREE.MeshBasicMaterial({
            color: 0x8899ff, transparent: true, opacity: .5,
            side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false
        })
    );
    jet.position.y = dir * 9;
    blackHoleGroup.add(jet);
});

// gravitational lens rings at tilted planes
[[3.2, .1, .28], [4.3, .06, -.45], [5.6, .05, .18]].forEach(([r, t, tilt], i) => {
    const lr = new THREE.Mesh(
        new THREE.TorusGeometry(r, t, 8, 80),
        new THREE.MeshBasicMaterial({
            color: [0xff8800, 0xcc00ff, 0x0088ff][i],
            transparent: true, opacity: .4,
            blending: THREE.AdditiveBlending, depthWrite: false
        })
    );
    lr.rotation.x = Math.PI / 2 + tilt;
    lr.rotation.z = tilt * 1.5;
    blackHoleGroup.add(lr);
});

const bhLight = new THREE.PointLight(0xff4400, 0, 22);
scene.add(bhLight);
const kiwiGlowLight = new THREE.PointLight(0x44ff88, 0, 16);
scene.add(kiwiGlowLight);
let kiwiRadiation = 0;

// Quasar jet beams — polar columns that grow brighter as kiwimon mutates
const _jetGeo = new THREE.CylinderGeometry(0.05, 1.0, 22, 8, 1, true);
const jetMatN = new THREE.MeshBasicMaterial({ color: 0x44ff88, transparent: true, opacity: 0,
    side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false });
const jetMatS = jetMatN.clone();
const kiwiJetN = new THREE.Mesh(_jetGeo, jetMatN);
const kiwiJetS = new THREE.Mesh(_jetGeo, jetMatS);
kiwiJetS.rotation.z = Math.PI; // south pole
kiwiJetN.visible = kiwiJetS.visible = false;
scene.add(kiwiJetN); scene.add(kiwiJetS);

// ── CHEESECAKE GLB ────────────────────────────────────────────────────────────
const gltfLoader = new GLTFLoader();
let cheesecakeTemplate = null;
let cheesecakeNormScale = 0.55; // updated after load based on actual model bounds
gltfLoader.load('assets/cheese_cake.glb', gltf => {
    // Normalize to ~1.1 scene units regardless of how the model was exported
    const box = new THREE.Box3().setFromObject(gltf.scene);
    const maxDim = Math.max(...box.getSize(new THREE.Vector3()).toArray());
    cheesecakeNormScale = maxDim > 0.001 ? 1.1 / maxDim : 1.0;
    // Center the pivot
    const center = box.getCenter(new THREE.Vector3());
    gltf.scene.position.sub(center.multiplyScalar(cheesecakeNormScale));
    gltf.scene.traverse(child => { if (child.isMesh) child.material.needsUpdate = true; });
    cheesecakeTemplate = gltf;
});

// ── UFO MINIGAME ──────────────────────────────────────────────────────────────
let ufoGamePhase = 'idle'; // 'idle' | 'playing' | 'feeding' | 'done'
let ufoCountdown = 10;
let ufoScore = 0;
let ufoWave = 0;
let ufoSpeedMult = 1.0;
const ufos = [];
const evilKiwis = [];
const collectedCakes = [];
let ufoSpawnTimer = 0;
let bombCount = 0;
let preBattleCombo = 0;
const UFO_MAX = 20;
const activeLasers = [];
const ufoExplosions = [];
const plasmaWaves = [];
const splashCakes = [];
let cakesEatenTotal = 0;
let draggedCake = null;
const ufoRay = new THREE.Raycaster();
const ufoMouse = new THREE.Vector2();
const dragPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);

const ufoHudEl       = document.getElementById('ufo-hud');
const ufoCountdownEl  = document.getElementById('ufo-countdown');
const ufoScoreEl     = document.getElementById('ufo-score');
const feedInstructEl  = document.getElementById('feed-instruct');
const cakePileEl     = document.getElementById('cake-pile');
const feedAllBtnEl   = document.getElementById('feed-all-btn');
const bombTrayEl     = document.getElementById('bomb-tray');

function updateBombTray() {
    // Keep the label element, rebuild bomb buttons
    const label = bombTrayEl.querySelector('#bomb-label');
    bombTrayEl.innerHTML = '';
    if (label) bombTrayEl.appendChild(label);
    bombTrayEl.style.opacity = bombCount > 0 && ufoGamePhase === 'playing' ? '1' : '0';
    for (let i = 0; i < bombCount; i++) {
        const btn = document.createElement('button');
        btn.className = 'bomb-btn'; btn.textContent = '💥';
        btn.title = 'NUCLEAR PLASMA BOMB — destroys all enemies!';
        btn.addEventListener('click', () => detonatePlasma());
        bombTrayEl.insertBefore(btn, label);
    }
}

function detonatePlasma() {
    if (bombCount <= 0 || ufoGamePhase !== 'playing') return;
    bombCount--;
    // Destroy every enemy and convert each to a cheesecake
    [...ufos, ...evilKiwis].forEach(e => { explodeAt(e.position.clone()); scene.remove(e); spawnCheesecake(); ufoScore++; });
    ufos.length = 0; evilKiwis.length = 0;
    ufoScoreEl.textContent = `🛸 DEFEATED: ${ufoScore}  ·  🍰 COLLECTED: ${collectedCakes.length}`;
    updateBombTray();
    playBoom();
    // Massive plasma flash
    flashEl.style.transition = 'opacity 0.02s';
    flashEl.style.opacity = '1';
    setTimeout(() => { flashEl.style.transition = 'opacity 2s'; flashEl.style.opacity = '0'; }, 90);
    // Three expanding plasma rings
    [0xffffff, 0x00aaff, 0xff44ff].forEach((col, i) => {
        const ring = new THREE.Mesh(
            new THREE.TorusGeometry(0.5, 0.25, 8, 80),
            new THREE.MeshBasicMaterial({ color: col, transparent: true, opacity: 1,
                blending: THREE.AdditiveBlending, depthWrite: false })
        );
        ring.rotation.x = Math.PI / 2 + i * 0.18;
        scene.add(ring);
        plasmaWaves.push({ ring, mat: ring.material, t: 0, delay: i * 0.1 });
    });
    for (let i = 0; i < 28; i++) setTimeout(() => spawnLightning(), i * 22);
}

function updateCakePile() {
    const n = collectedCakes.length;
    cakePileEl.innerHTML = '';
    const show = ufoGamePhase === 'playing' || ufoGamePhase === 'feeding';
    cakePileEl.style.opacity = (n > 0 && show) ? '1' : '0';
    const max = Math.min(n, 22);
    for (let i = 0; i < max; i++) {
        const s = document.createElement('span');
        s.className = 'cake-icon'; s.textContent = '🍰';
        cakePileEl.appendChild(s);
    }
    if (n > 22) {
        const s = document.createElement('span');
        s.className = 'cake-extra'; s.textContent = `+${n - 22}`;
        cakePileEl.appendChild(s);
    }
}

function feedAll() {
    const cakes = [...collectedCakes];
    cakes.forEach((cake, i) => {
        setTimeout(() => {
            if (!cake.userData.fed && collectedCakes.includes(cake)) {
                feedCakeToKiwi(cake);
            }
        }, i * 650);
    });
}

feedAllBtnEl.addEventListener('click', () => { if (ufoGamePhase === 'feeding') feedAll(); });

function createFallbackCheesecake() {
    const g = new THREE.Group();
    g.add(new THREE.Mesh(
        new THREE.CylinderGeometry(0.6, 0.62, 0.28, 12),
        new THREE.MeshStandardMaterial({ color: 0xc89040, flatShading: true })
    ));
    const filling = new THREE.Mesh(
        new THREE.CylinderGeometry(0.58, 0.58, 0.22, 12),
        new THREE.MeshStandardMaterial({ color: 0xfff8e0, flatShading: true })
    );
    filling.position.y = 0.25;
    g.add(filling);
    const topping = new THREE.Mesh(
        new THREE.CylinderGeometry(0.5, 0.5, 0.1, 12),
        new THREE.MeshStandardMaterial({ color: 0xff2244, flatShading: true })
    );
    topping.position.y = 0.41;
    g.add(topping);
    g.add(new THREE.Mesh(
        new THREE.SphereGeometry(0.9, 8, 8),
        new THREE.MeshBasicMaterial({ color: 0xffee44, transparent: true, opacity: 0.14,
            blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.BackSide })
    ));
    return g;
}

function createUFO() {
    const g = new THREE.Group();
    const saucerMat = new THREE.MeshStandardMaterial({ color: 0x99bbee, metalness: 0.85, roughness: 0.15, emissive: 0x001122 });
    g.add(new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.52, 0.2, 16), saucerMat));
    g.add(new THREE.Mesh(new THREE.TorusGeometry(0.56, 0.07, 8, 24),
        new THREE.MeshStandardMaterial({ color: 0xbbddff, metalness: 0.9, roughness: 0.1 })));
    const dome = new THREE.Mesh(
        new THREE.SphereGeometry(0.3, 14, 8, 0, Math.PI * 2, 0, Math.PI * 0.52),
        new THREE.MeshStandardMaterial({ color: 0x44ffaa, transparent: true, opacity: 0.72,
            metalness: 0.3, roughness: 0.1, emissive: 0x003322 })
    );
    dome.position.y = 0.1;
    g.add(dome);
    const glowRing = new THREE.Mesh(
        new THREE.TorusGeometry(0.48, 0.055, 8, 32),
        new THREE.MeshBasicMaterial({ color: 0x00ff88, transparent: true, opacity: 0.9,
            blending: THREE.AdditiveBlending, depthWrite: false })
    );
    glowRing.rotation.x = Math.PI / 2;
    glowRing.position.y = -0.08;
    g.add(glowRing);
    const pilot = new THREE.Mesh(new THREE.SphereGeometry(0.09, 6, 6),
        new THREE.MeshBasicMaterial({ color: 0x220033 }));
    pilot.position.y = 0.27;
    g.add(pilot);
    // Green outer halo
    const halo = new THREE.Mesh(
        new THREE.SphereGeometry(0.92, 12, 10),
        new THREE.MeshBasicMaterial({ color: 0x00ff55, transparent: true, opacity: 0.2,
            blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.BackSide })
    );
    g.add(halo);
    // Red saturated enemy-indicator ring
    const enemyRing = new THREE.Mesh(
        new THREE.TorusGeometry(0.78, 0.048, 8, 36),
        new THREE.MeshBasicMaterial({ color: 0xff0011, transparent: true, opacity: 0.92,
            blending: THREE.AdditiveBlending, depthWrite: false })
    );
    enemyRing.rotation.x = Math.PI / 2;
    g.add(enemyRing);
    g.userData = {
        orbitR: 3.8 + Math.random() * 2.4,
        theta: Math.random() * Math.PI * 2,
        phi: (Math.random() - 0.5) * 0.7,
        speed: (0.5 + Math.random() * 0.9) * (Math.random() > 0.5 ? 1 : -1),
        wobble: Math.random() * Math.PI * 2,
        halo, enemyRing
    };
    return g;
}

function createEvilKiwi() {
    const g = new THREE.Group();
    const bodyMat = new THREE.MeshStandardMaterial({ color: 0xcc0000, flatShading: true, emissive: 0x440000 });
    g.add(new THREE.Mesh(new THREE.IcosahedronGeometry(0.42, 0), bodyMat));
    // Belly
    const belly = new THREE.Mesh(new THREE.IcosahedronGeometry(0.26, 0),
        new THREE.MeshStandardMaterial({ color: 0x880000, flatShading: true }));
    belly.scale.set(0.65, 0.75, 0.4); belly.position.z = 0.28; g.add(belly);
    // Yellow eyes
    [-0.11, 0.11].forEach(x => {
        const e = new THREE.Mesh(new THREE.SphereGeometry(0.065, 5, 5),
            new THREE.MeshBasicMaterial({ color: 0xffff00 }));
        e.position.set(x, 0.09, 0.38); g.add(e);
    });
    // Beak
    const beak = new THREE.Mesh(new THREE.ConeGeometry(0.07, 0.2, 4),
        new THREE.MeshStandardMaterial({ color: 0xff4400, flatShading: true }));
    beak.rotation.x = Math.PI / 2; beak.position.set(0, -0.02, 0.52); g.add(beak);
    // Red glow halo
    const halo = new THREE.Mesh(new THREE.SphereGeometry(0.7, 10, 8),
        new THREE.MeshBasicMaterial({ color: 0xff2200, transparent: true, opacity: 0.22,
            blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.BackSide }));
    g.add(halo);
    // Layered-sinusoid params simulate Perlin-like noise movement
    g.userData = {
        p1: Math.random() * Math.PI * 2, p2: Math.random() * Math.PI * 2,
        p3: Math.random() * Math.PI * 2, p4: Math.random() * Math.PI * 2,
        f1: 0.25 + Math.random() * 0.3,  f2: 0.6  + Math.random() * 0.5,
        f3: 1.1  + Math.random() * 0.7,  f4: 0.15 + Math.random() * 0.2,
        baseR: 6.5 + Math.random() * 3,
        halo, isEvilKiwi: true
    };
    return g;
}

function fireLaser(from, to) {
    const geo = new THREE.BufferGeometry().setFromPoints([from.clone(), to.clone()]);
    const mat  = new THREE.LineBasicMaterial({ color: 0xff3300, transparent: true, opacity: 1,
        blending: THREE.AdditiveBlending, depthWrite: false });
    const mat2 = new THREE.LineBasicMaterial({ color: 0xff9900, transparent: true, opacity: 0.5,
        blending: THREE.AdditiveBlending, depthWrite: false });
    const line  = new THREE.Line(geo, mat);
    const line2 = new THREE.Line(geo, mat2);
    scene.add(line); scene.add(line2);
    activeLasers.push({ line, line2, mat, mat2, geo, life: 1.0 });
}

function explodeAt(pos) {
    const N = 55;
    const positions = new Float32Array(N * 3);
    const velocities = [];
    for (let i = 0; i < N; i++) {
        positions[i * 3] = pos.x; positions[i * 3 + 1] = pos.y; positions[i * 3 + 2] = pos.z;
        const speed = 0.05 + Math.random() * 0.1;
        const th = Math.random() * Math.PI * 2, ph = Math.random() * Math.PI;
        velocities.push({ x: Math.sin(ph)*Math.cos(th)*speed, y: Math.sin(ph)*Math.sin(th)*speed,
            z: Math.cos(ph)*speed, life: 1 });
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    const mat = new THREE.PointsMaterial({ size: 0.13, color: 0xff8800,
        blending: THREE.AdditiveBlending, depthWrite: false, transparent: true });
    const pts = new THREE.Points(geo, mat);
    scene.add(pts);
    const exLight = new THREE.PointLight(0xff8800, 40, 8);
    exLight.position.copy(pos);
    scene.add(exLight);
    ufoExplosions.push({ pts, geo, mat, velocities, t: 0, exLight });
}

function spawnCheesecake() {
    const cake = cheesecakeTemplate ? cheesecakeTemplate.scene.clone(true) : createFallbackCheesecake();
    const baseScale = cheesecakeTemplate ? cheesecakeNormScale : 0.55;
    cake.userData.baseScale = baseScale;
    cake.scale.setScalar(0.01); // scales up during emerge
    const angle = Math.random() * Math.PI * 2;
    const r = 2.4 + Math.random() * 1.6;
    const oy = (Math.random() - 0.5) * 1.8;
    // Start at orbit position so it's never hidden inside the black hole
    cake.position.set(r * Math.cos(angle), oy, r * Math.sin(angle));
    cake.userData.orbitAngle = angle;
    cake.userData.orbitR = r;
    cake.userData.orbitY = oy;
    cake.userData.orbitSpeed = (0.22 + Math.random() * 0.18) * (Math.random() > 0.5 ? 1 : -1);
    cake.userData.emergeT = 0;
    cake.userData.fed = false;
    cake.userData.dragging = false;
    scene.add(cake);
    collectedCakes.push(cake);
    updateCakePile();
}

function feedCakeToKiwi(cake) {
    cake.userData.fed = true;
    explodeAt(cake.position.clone());
    scene.remove(cake);
    collectedCakes.splice(collectedCakes.indexOf(cake), 1);
    flashEl.style.transition = 'opacity 0.03s';
    flashEl.style.opacity = '0.3';
    setTimeout(() => { flashEl.style.transition = 'opacity 0.5s'; flashEl.style.opacity = '0'; }, 45);
    kiwiRadiation += 0.1; // unbounded — more cakes = bigger kiwimon
    cakesEatenTotal++;
    playNom();
    if (collectedCakes.length === 0) {
        statusEl.innerHTML = '<span style="color:#88ff88;text-shadow:0 0 10px #00ff44">KIWIMON IS SATISFIED! 🥝💚</span>';
    }
    ufoScoreEl.textContent = `🛸 DEFEATED: ${ufoScore}  ·  🍰 FED: ${ufoScore - collectedCakes.length} / ${ufoScore}`;
    updateCakePile();
}

function startUFOMinigame() {
    ufoGamePhase = 'playing';
    ufoCountdown = 10;
    ufoScore = 0;
    ufoSpawnTimer = 0;
    ufoHudEl.style.opacity = '1';
    ufoCountdownEl.textContent = '10';
    ufoCountdownEl.style.color = '#ff4400';
    ufoWave = 0;
    ufoSpeedMult = 1.0;
    cakesEatenTotal = 0;
    preBattleCombo = comboCount;
    bombCount = Math.floor(comboCount / 50); // 1 bomb per 50 pre-battle clicks
    ufoScoreEl.textContent = '🛸 DEFEATED: 0  ·  🍰 COLLECTED: 0';
    statusEl.innerHTML = '<span style="color:#ff4400;font-size:13px;letter-spacing:4px;text-shadow:0 0 14px #ff4400">🛸 DEFEND THE BLACK HOLE — CLICK UFOs!</span>';
    for (let i = 0; i < 3; i++) { const u = createUFO(); scene.add(u); ufos.push(u); }
    cakePileEl.style.opacity = '0';
    updateBombTray();
    // Slide to top-down battle view and lock orbit during the minigame
    orbitLocked = true;
    camTargetPhi = 0.12; camTargetTheta = 0; camTargetRadius = 19;
    camAnimating = true; camOnArrival = null;
    startBattleMusic();
}

function endUFOMinigame() {
    stopBattleMusic();
    ufoGamePhase = 'feeding';
    [...ufos].forEach(u => { explodeAt(u.position.clone()); scene.remove(u); });
    ufos.length = 0;
    [...evilKiwis].forEach(ek => { explodeAt(ek.position.clone()); scene.remove(ek); });
    evilKiwis.length = 0;
    bombTrayEl.style.opacity = '0';
    ufoCountdownEl.textContent = '⏰';
    ufoCountdownEl.style.color = '#ffcc00';
    kiwi.visible = true;
    kiwi.position.set(0, -1.5, 0);
    kiwi.scale.setScalar(0.9);
    kiwi.rotation.set(0, 0, 0);
    const n = collectedCakes.length;
    if (n > 0) {
        statusEl.innerHTML = `<span style="color:#ffcc00;font-size:13px;letter-spacing:3px;text-shadow:0 0 10px #ffcc00">🍰 ${n} CHEESECAKE${n > 1 ? 'S' : ''} COLLECTED! DRAG OR FEED ALL!</span>`;
        feedInstructEl.style.opacity = '1';
        feedAllBtnEl.style.opacity = '1'; feedAllBtnEl.style.pointerEvents = 'auto';
    } else {
        statusEl.innerHTML = '<span style="color:#ff8888">NO CAKES COLLECTED... CLICK CONTINUE</span>';
    }
    updateCakePile();
    btnEl.textContent = '✅ DONE FEEDING';
    btnEl.style.pointerEvents = 'auto';
    btnEl.onclick = () => { btnEl.onclick = null; finishMinigameAndContinue(); };
    // Return to frontal view; unlock orbit once camera arrives so user can drag cakes freely
    camTargetPhi = Math.PI * 0.45; camTargetTheta = 0; camTargetRadius = 8;
    camAnimating = true; camOnArrival = () => { orbitLocked = false; };
}

function finishMinigameAndContinue() {
    stopBattleMusic();
    ufoGamePhase = 'done';
    orbitLocked = false; camAnimating = false;
    ufoHudEl.style.opacity = '0';
    feedInstructEl.style.opacity = '0';
    feedAllBtnEl.style.opacity = '0'; feedAllBtnEl.style.pointerEvents = 'none';
    cakePileEl.style.opacity = '0';
    kiwiRadiation = 0; kiwiGlowLight.intensity = 0;
    jetMatN.opacity = 0; jetMatS.opacity = 0; kiwiJetN.visible = kiwiJetS.visible = false;
    activeLasers.forEach(l => { scene.remove(l.line); scene.remove(l.line2); l.geo.dispose(); l.mat.dispose(); l.mat2.dispose(); });
    activeLasers.length = 0;
    ufoExplosions.forEach(ex => { scene.remove(ex.pts); ex.geo.dispose(); ex.mat.dispose(); scene.remove(ex.exLight); });
    ufoExplosions.length = 0;
    plasmaWaves.forEach(pw => { scene.remove(pw.ring); pw.ring.geometry.dispose(); pw.mat.dispose(); });
    plasmaWaves.length = 0;
    evilKiwis.forEach(ek => scene.remove(ek)); evilKiwis.length = 0;
    collectedCakes.forEach(c => scene.remove(c));
    collectedCakes.length = 0;
    bombTrayEl.style.opacity = '0'; bombCount = 0;
    draggedCake = null;
    kiwi.visible = false;
    kiwi.position.set(0, 0, 0);
    flashEl.style.transition = 'opacity 0.04s';
    flashEl.style.opacity = '.8';
    setTimeout(() => { flashEl.style.transition = 'opacity 2.2s'; flashEl.style.opacity = '0'; }, 70);
    blackHoleGroup.visible = false;
    bhLight.intensity = 0;
    eggMesh.visible = true; eggAura.visible = true;
    eggMesh.scale.set(.01, .015, .01); eggMesh.position.set(0, 0, 0); eggMesh.rotation.set(0, 0, 0);
    eggAura.scale.setScalar(.01); eggAura.position.set(0, 0, 0);
    orbGroup.children.forEach(o => { o.userData.baseR = 2.5; });
    gameState = 'egg'; eggT = 0; comboCount = 0; comboTimer = 0; comboEl.style.opacity = '0';
    statusEl.textContent = 'A NEW EGG HAS APPEARED...';
    setTimeout(() => { if (gameState === 'egg') statusEl.textContent = 'CLICK TO HATCH'; }, 2800);
    btnEl.textContent = '🥚 HATCH';
    btnEl.style.pointerEvents = 'auto';
}

function showTimePopup(worldPos, text) {
    const ndc = worldPos.clone().project(camera);
    const x = (ndc.x * 0.5 + 0.5) * innerWidth;
    const y = (1 - (ndc.y * 0.5 + 0.5)) * innerHeight;
    const el = document.createElement('div');
    el.style.cssText = `position:absolute;left:${x}px;top:${y}px;transform:translate(-50%,-50%);
        color:#00ff88;font-family:'Courier New',monospace;font-size:17px;font-weight:bold;
        letter-spacing:2px;text-shadow:0 0 10px #00ff88,0 0 22px #00ff44;
        pointer-events:none;z-index:200;opacity:1;
        transition:top 0.9s ease-out,opacity 0.9s ease-out;`;
    el.textContent = text;
    document.body.appendChild(el);
    setTimeout(() => { el.style.top = `${y - 70}px`; el.style.opacity = '0'; }, 40);
    setTimeout(() => el.remove(), 1050);
}

// UFO + evil kiwi click — capture phase fires before orbit's click handler
renderer.domElement.addEventListener('click', e => {
    if (ufoGamePhase !== 'playing' || didDrag) return;
    ufoMouse.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
    ufoRay.setFromCamera(ufoMouse, camera);
    const allEnemies = [...ufos, ...evilKiwis];
    const meshes = [];
    allEnemies.forEach(g => g.traverse(ch => { if (ch.isMesh) meshes.push(ch); }));
    const hits = ufoRay.intersectObjects(meshes);
    if (!hits.length) return;
    let obj = hits[0].object;
    while (obj && !allEnemies.includes(obj)) obj = obj.parent;
    if (!obj) return;
    fireLaser(camera.position.clone(), obj.position.clone());
    explodeAt(obj.position.clone());
    scene.remove(obj);
    const _isEvil = evilKiwis.includes(obj);
    if (!_isEvil) { ufos.splice(ufos.indexOf(obj), 1); playPop(820, 55, 0.055); }
    else {
        evilKiwis.splice(evilKiwis.indexOf(obj), 1);
        ufoCountdown = Math.min(20, ufoCountdown + 1.0); // +1s bonus
        ufoCountdownEl.style.color = '#00ff88';
        setTimeout(() => { if (ufoGamePhase==='playing') ufoCountdownEl.style.color = ufoCountdown<=3?'#ff0000':'#ff4400'; }, 700);
        showTimePopup(obj.position.clone(), '+1.0s ⏱');
        playPop(520, 80, 0.065);
    }
    ufoScore++;
    spawnCheesecake();
    ufoScoreEl.textContent = `🛸 DEFEATED: ${ufoScore}  ·  🍰 COLLECTED: ${collectedCakes.length}`;
    flashEl.style.transition = 'opacity 0.02s';
    flashEl.style.opacity = '0.12';
    setTimeout(() => { flashEl.style.transition = 'opacity 0.3s'; flashEl.style.opacity = '0'; }, 30);
    spawnLightning();
}, true);

// Cheesecake drag — capture phase so we can block orbit camera
renderer.domElement.addEventListener('mousedown', e => {
    if (ufoGamePhase !== 'feeding') return;
    ufoMouse.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
    ufoRay.setFromCamera(ufoMouse, camera);
    const meshes = [];
    collectedCakes.forEach(c => { if (!c.userData.fed) c.traverse(ch => { if (ch.isMesh) meshes.push(ch); }); });
    if (!meshes.length) return;
    const hits = ufoRay.intersectObjects(meshes);
    if (!hits.length) return;
    let obj = hits[0].object;
    while (obj && !collectedCakes.includes(obj)) obj = obj.parent;
    if (!obj || !collectedCakes.includes(obj)) return;
    draggedCake = obj;
    draggedCake.userData.dragging = true;
    dragPlane.setFromNormalAndCoplanarPoint(
        camera.getWorldDirection(new THREE.Vector3()).negate(), draggedCake.position);
    e.stopImmediatePropagation(); // prevent orbit mousedown from activating
}, true);

window.addEventListener('mousemove', e => {
    if (!draggedCake) return;
    ufoMouse.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
    ufoRay.setFromCamera(ufoMouse, camera);
    const target = new THREE.Vector3();
    if (ufoRay.ray.intersectPlane(dragPlane, target)) draggedCake.position.copy(target);
}, true);

window.addEventListener('mouseup', () => {
    if (!draggedCake) return;
    if (draggedCake.position.distanceTo(kiwi.position) < 2.4) {
        feedCakeToKiwi(draggedCake);
    } else {
        draggedCake.userData.dragging = false;
    }
    draggedCake = null;
}, true);

let orbitActive = false, orbitLastX = 0, orbitLastY = 0;
let orbitTheta = 0, orbitPhi = Math.PI * .45, orbitRadius = 8;
let mouseDownX = 0, mouseDownY = 0, didDrag = false;
let orbitLocked = false;
let camTargetPhi = null, camTargetTheta = null, camTargetRadius = null;
let camAnimating = false, camOnArrival = null;
function lerpAngle(a, b, t) { let d = b - a; while (d > Math.PI) d -= Math.PI*2; while (d < -Math.PI) d += Math.PI*2; return a + d * t; }

renderer.domElement.addEventListener('mousedown', e => {
    orbitActive = true; didDrag = false;
    orbitLastX = mouseDownX = e.clientX;
    orbitLastY = mouseDownY = e.clientY;
});
window.addEventListener('mouseup', () => { orbitActive = false; });
window.addEventListener('mousemove', e => {
    if (!orbitActive || orbitLocked) return;
    if (Math.hypot(e.clientX - mouseDownX, e.clientY - mouseDownY) > 5) didDrag = true;
    const dx = e.clientX - orbitLastX, dy = e.clientY - orbitLastY;
    orbitLastX = e.clientX; orbitLastY = e.clientY;
    orbitTheta -= dx * .005;
    orbitPhi = Math.max(.1, Math.min(Math.PI - .1, orbitPhi - dy * .005));
});
renderer.domElement.addEventListener('wheel', e => {
    orbitRadius = Math.max(3, Math.min(55, orbitRadius + e.deltaY * .01));
}, { passive: true });
renderer.domElement.addEventListener('click', () => { if (!didDrag) triggerBurst(); });
window.addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); triggerBurst(); } });

// touch
let touchSX = 0, touchSY = 0, touchDragged = false;
renderer.domElement.addEventListener('touchstart', e => {
    touchSX = orbitLastX = e.touches[0].clientX;
    touchSY = orbitLastY = e.touches[0].clientY;
    orbitActive = true; touchDragged = false;
}, { passive: true });
renderer.domElement.addEventListener('touchmove', e => {
    if (!orbitActive || orbitLocked) return;
    if (Math.hypot(e.touches[0].clientX - touchSX, e.touches[0].clientY - touchSY) > 5) touchDragged = true;
    const dx = e.touches[0].clientX - orbitLastX, dy = e.touches[0].clientY - orbitLastY;
    orbitLastX = e.touches[0].clientX; orbitLastY = e.touches[0].clientY;
    orbitTheta -= dx * .005;
    orbitPhi = Math.max(.1, Math.min(Math.PI - .1, orbitPhi - dy * .005));
}, { passive: true });
renderer.domElement.addEventListener('touchend', () => {
    orbitActive = false;

function triggerBurst() {
    // state guards
    if (gameState === 'ultra-burst' || gameState === 'blackhole' || gameState === 'cookie-burst') return;
    if (gameState === 'egg') { hatchEgg(); return; }
    if (gameState === 'cookie') { resetToKiwimon(); return; }

    // advance combo before anything else
    comboCount++;
    comboTimer = 2.8;
    playPop(660, 180, 0.072);

    // ⚡ At ≥10 clicks, ultra fires 800ms after the LAST click (debounced)
    if (comboCount >= 10 && introComplete) {
        ultraPending = true;
        clearTimeout(ultraPendingTimer);
        ultraPendingTimer = setTimeout(() => { ultraPending = false; ultraPendingTimer = null; triggerUltraBurst(); }, 800);
    }
    // burst animation always plays so every click feels responsive

    burstActive = true;
    burstT = 0;

    // screen flash
    flashEl.style.transition = 'opacity 0.04s';
    flashEl.style.opacity = '.92';
    setTimeout(() => { flashEl.style.transition = 'opacity 0.85s'; flashEl.style.opacity = '0'; }, 65);

    statusEl.innerHTML = 'DIGIVOLUTION SEQUENCE: <span style="color:#ffff44;text-shadow:0 0 8px #ff0">ACTIVE ⚡</span>';
    fillEl.style.width = '100%';
    fillEl.style.boxShadow = '0 0 16px #ffffff, 0 0 8px #ff00ff';

    // staggered shockwaves
    shockwaves.forEach((sw, i) => {
        setTimeout(() => {
            sw.scale.set(.01, .01, .01);
            sw.material.opacity = 1;
            sw.userData.active = true;
            sw.userData.t = 0;
        }, i * 140);
    });

    // particles
    const pa = burstGeo.attributes.position.array;
    for (let i = 0; i < PCOUNT; i++) {
        pa[i * 3] = pa[i * 3 + 1] = pa[i * 3 + 2] = 0;
        const speed = .05 + Math.random() * .13;
        const th = Math.random() * Math.PI * 2;
        const ph = Math.random() * Math.PI;
        bVel[i] = {
            x: Math.sin(ph) * Math.cos(th) * speed,
            y: Math.sin(ph) * Math.sin(th) * speed + .035,
            z: Math.cos(ph) * speed,
            life: 1
        };
    }
    burstGeo.attributes.position.needsUpdate = true;
    burstMat.opacity = 1;

    // beams stagger in
    beams.forEach((b, i) => setTimeout(() => { b.material.opacity = .5 + Math.random() * .35; }, i * 22));

    // lightning volley
    for (let i = 0; i < 14; i++) setTimeout(() => spawnLightning(), i * 38);

    // combo display
    if (comboCount > 1) {
        comboEl.style.color = '#ffff44';
        comboEl.style.textShadow = '0 0 20px #ffff00, 0 0 40px #ff8800';
        comboEl.style.fontSize = '44px';
        comboEl.textContent = `COMBO ×${comboCount}`;
        comboEl.style.opacity = '1';
    }

    btnEl.textContent = '⚡ DIGIVOLVING...';
    btnEl.style.pointerEvents = 'none';
}

// ── ANIMATE ──────────────────────────────────────────────────────────────────

let lastFrameTime = performance.now();

function animate(t) {
    requestAnimationFrame(animate);
    const dt = Math.min((t - lastFrameTime) * .001, .05);
    lastFrameTime = t;
    const time = t * .001;

    // orbit camera — lerp toward target when camAnimating
    if (camAnimating) {
        orbitPhi    = orbitPhi    + (camTargetPhi    - orbitPhi)    * 0.045;
        orbitRadius = orbitRadius + (camTargetRadius - orbitRadius) * 0.045;
        orbitTheta  = lerpAngle(orbitTheta, camTargetTheta, 0.045);
        if (Math.abs(orbitPhi - camTargetPhi) < 0.004 && Math.abs(orbitRadius - camTargetRadius) < 0.04) {
            orbitPhi = camTargetPhi; orbitRadius = camTargetRadius; orbitTheta = camTargetTheta;
            camAnimating = false;
            if (camOnArrival) { camOnArrival(); camOnArrival = null; }
        }
    }
    camera.position.set(
        orbitRadius * Math.sin(orbitPhi) * Math.sin(orbitTheta),
        orbitRadius * Math.cos(orbitPhi),
        orbitRadius * Math.sin(orbitPhi) * Math.cos(orbitTheta)
    );
    camera.lookAt(0, 0, 0);

    // idle animation (only in normal state after intro)
    if (introComplete && gameState === 'normal') {
        kiwi.rotation.y += .01;
        kiwi.rotation.x = Math.sin(time * .7) * .08;
        kiwi.position.y  = Math.sin(time * 1.4) * .35;
        // subtle living emissive pulse
        const idleG = .07 + Math.sin(time * 1.6) * .03;
        bodyMat.emissive.setRGB(idleG * .45, idleG, idleG * .55);
        crestMat.emissive.setRGB(idleG * 1.2, idleG * .3, idleG * 1.2);
    }

    starField.rotation.y += .0004;

    orbGroup.rotation.y += .02;
    orbGroup.children.forEach((o, i) => {
        const a = o.userData.angle + time;
        const r = o.userData.baseR + Math.sin(time * 3 + i) * .15;
        o.position.set(Math.cos(a) * r, Math.sin(a * 2) * .8, Math.sin(a) * r);
    });

    rings.forEach(r => { r.rotation.z += .003; });

    pinkLight.intensity = 20 + Math.sin(time * 2)     * 8;
    cyanLight.intensity = 15 + Math.sin(time * 2.5 + 1) * 6;

    // combo timer decay (only reset in normal state)
    if (comboTimer > 0) {
        comboTimer -= dt;
        if (comboTimer <= 0 && gameState === 'normal') { comboCount = 0; comboEl.style.opacity = '0'; }
    }

    // ── BURST ANIMATION ──────────────────────────────────────────────────────
    if (burstActive) {
        burstT += dt * .72;

        // explosive lights
        burstLight.intensity  = Math.max(0, 95  * Math.exp(-burstT * 4.5));
        burstLight2.intensity = Math.max(0, 58  * Math.exp(-burstT * 2.2));

        // shockwave expansion
        shockwaves.forEach(sw => {
            if (!sw.userData.active) return;
            sw.userData.t += dt;
            const s = 1 + sw.userData.t * 13;
            sw.scale.set(s, s, s);
            sw.material.opacity = Math.max(0, 1 - sw.userData.t * 1.6);
            if (sw.material.opacity <= 0) sw.userData.active = false;
        });

        // particles fly outward
        const pa = burstGeo.attributes.position.array;
        for (let i = 0; i < PCOUNT; i++) {
            if (bVel[i].life > 0) {
                pa[i * 3]     += bVel[i].x;
                pa[i * 3 + 1] += bVel[i].y;
                pa[i * 3 + 2] += bVel[i].z;
                bVel[i].life  -= dt * .6;
            }
        }
        burstGeo.attributes.position.needsUpdate = true;
        burstMat.opacity = Math.max(0, 1 - burstT * .65);
        burstMat.color.setHex(burstT < .35 ? 0xffffff : 0xffaaff);

        // beams fade out slowly
        beams.forEach(b => { b.material.opacity = Math.max(0, b.material.opacity - dt * .5); });

        // kiwimon intro scale-up, then pulse
        if (!introComplete) {
            const s = Math.min(1, burstT * 1.6);
            kiwi.scale.setScalar(s);
            kiwi.rotation.y += .14;
            if (s >= .99) {
                introComplete = true;
                kiwi.scale.setScalar(1);
                hintEl.style.opacity = '1';
            }
        } else {
            kiwi.scale.setScalar(1 + Math.max(0, .22 * Math.sin(burstT * 22) * (1 - burstT)));
            kiwi.rotation.y += Math.max(0, .14 * (1 - burstT * 1.8));
        }

        // screen shake at impact
        if (burstT < .28) {
            const sh = .045 * (1 - burstT / .28);
            camera.position.x += (Math.random() - .5) * sh;
            camera.position.y += (Math.random() - .5) * sh;
        }

        // body + crest glow flare
        const glow = Math.max(0, 1 - burstT * 1.7);
        bodyMat.emissive.setRGB(glow * .4, glow, glow * .5);
        crestMat.emissive.setRGB(glow, glow * .28, glow);

        // occasional residual lightning
        if (Math.random() < .09 * Math.max(0, 1 - burstT)) spawnLightning();

        // orbs burst outward then snap back
        orbGroup.children.forEach(o => {
            if (burstT < .45) o.userData.baseR = 2.5 + (1 - burstT * 2.2) * 2.2;
            else o.userData.baseR = Math.max(2.5, o.userData.baseR - dt * 2.5);
        });

        // star size flare
        starMat.size = .12 + Math.max(0, 1 - burstT * 3) * .1;

        // end burst
        if (burstT > 2.1) {
            burstActive = false;
            burstLight.intensity = burstLight2.intensity = 0;
            burstMat.opacity = 0;
            beams.forEach(b => { b.material.opacity = 0; });
            bodyMat.emissive.setHex(0x113322);
            crestMat.emissive.setHex(0x440044);
            kiwi.scale.setScalar(1);
            starMat.size = .12;
            orbGroup.children.forEach(o => { o.userData.baseR = 2.5; });
            statusEl.textContent = 'DIGIVOLUTION COMPLETE ✓';
            fillEl.style.width = '100%';
            fillEl.style.boxShadow = '0 0 6px #ff00ff';
            btnEl.textContent = '⚡ DIGIVOLVE';
            btnEl.style.pointerEvents = 'auto';
            setTimeout(() => {
                statusEl.textContent = 'DIGIVOLUTION ENERGY: 98%';
                fillEl.style.width = '98%';
            }, 2000);
        }
    }

    // ── ULTRA-BURST ───────────────────────────────────────────────────────────
    if (gameState === 'ultra-burst') {
        ultraT += dt;

        // kiwimon spins violently and swells
        kiwi.rotation.y += ultraT * .3;
        kiwi.scale.setScalar(1 + ultraT * .4);
        kiwi.position.y = Math.sin(time * 12) * .08;

        // rapid emissive flicker
        const fl = Math.sin(ultraT * 55) > 0;
        bodyMat.emissive.setRGB(fl ? 1 : .1, fl ? .05 : 1, fl ? .4 : .4);
        crestMat.emissive.setRGB(fl ? 1 : 0, fl ? .4 : 0, fl ? 0 : 1);

        // orbs spiral inward
        orbGroup.children.forEach(o => { o.userData.baseR = Math.max(0, o.userData.baseR - dt * 2.2); });

        // burst lights thrash
        burstLight.intensity  = 50 + Math.sin(ultraT * 25) * 40;
        burstLight2.intensity = 30 + Math.sin(ultraT * 18) * 25;

        if (Math.random() < .2) spawnLightning();

        // collapse: hide kiwimon, reveal black hole
        if (ultraT > 1.9) {
            flashEl.style.transition = 'opacity 0.03s';
            flashEl.style.opacity = '1';
            setTimeout(() => { flashEl.style.transition = 'opacity 3s'; flashEl.style.opacity = '0'; }, 90);

            kiwi.visible = false;
            kiwi.scale.setScalar(1);
            kiwi.position.set(0, 0, 0);
            kiwi.rotation.set(0, 0, 0);
            bodyMat.emissive.setHex(0x113322);
            crestMat.emissive.setHex(0x440044);
            burstLight.intensity = burstLight2.intensity = 0;

            blackHoleGroup.visible = true;
            blackHoleGroup.scale.setScalar(.02);
            blackHoleGroup.rotation.set(0, 0, 0);
            bhLight.intensity = 70;
            // orbs reset to spiral into BH
            orbGroup.children.forEach(o => { o.userData.baseR = .4 + Math.random() * 2.5; });

            gameState = 'blackhole';
            bhT = 0;
            startUFOMinigame();
        }
    }

    // ── BLACK HOLE ────────────────────────────────────────────────────────────
    if (gameState === 'blackhole') {
        bhT += dt;

        // scale up from singularity
        blackHoleGroup.scale.setScalar(Math.min(1, bhT * 1.6));
        blackHoleGroup.rotation.y += dt * .22;

        // accretion disks spin at different speeds/directions
        diskMeshes.forEach((d, i) => {
            d.rotation.z += dt * diskSpeeds[i] * (i % 2 ? 1 : -1);
        });

        // light transitions orange → purple over time
        bhLight.intensity = Math.max(18, 70 * Math.exp(-bhT * .6)) + Math.sin(bhT * 3) * 8;
        bhLight.color.setHex(bhT < 2 ? 0xff4400 : 0xaa00ff);

        // orbs spiral into event horizon with increasing angular speed
        orbGroup.children.forEach(o => {
            if (o.userData.baseR > 0) {
                const pull = .35 + (2.5 - Math.min(2.5, o.userData.baseR)) * .55;
                o.userData.baseR = Math.max(0, o.userData.baseR - dt * pull);
                o.userData.angle += dt * (2.5 - o.userData.baseR) * 1.4;
            }
        });

        if (Math.random() < .05) spawnLightning();

        // ── UFO MINIGAME ─────────────────────────────────────────────────────
        if (ufoGamePhase === 'playing') {
            ufoCountdown -= dt;
            const disp = Math.max(0, Math.ceil(ufoCountdown));
            ufoCountdownEl.textContent = disp;
            if (disp <= 3) ufoCountdownEl.style.color = '#ff0000';
            if (ufoCountdown <= 0) endUFOMinigame();

            ufoSpawnTimer += dt;
            if (ufoSpawnTimer > 2.2 && ufos.length < UFO_MAX) {
                ufoSpawnTimer = 0;
                const u = createUFO();
                u.userData.speed *= ufoSpeedMult;
                scene.add(u); ufos.push(u);
            }

            ufos.forEach(u => {
                u.userData.theta += dt * u.userData.speed;
                const r = u.userData.orbitR;
                const phiW = u.userData.phi + Math.sin(time * 0.8 + u.userData.wobble) * 0.25;
                u.position.set(
                    r * Math.cos(u.userData.theta) * Math.cos(phiW),
                    r * Math.sin(phiW) + Math.sin(time * 1.3 + u.userData.wobble) * 0.4,
                    r * Math.sin(u.userData.theta) * Math.cos(phiW)
                );
                u.rotation.y += dt * 1.2;
                u.rotation.z = Math.sin(u.userData.theta * 2) * 0.12;
                // Pulse halo and flash enemy ring
                if (u.userData.halo) {
                    u.userData.halo.material.opacity = 0.13 + Math.sin(time * 4 + u.userData.wobble) * 0.1;
                    u.userData.halo.scale.setScalar(1 + Math.sin(time * 2.5 + u.userData.wobble) * 0.07);
                }
                if (u.userData.enemyRing) {
                    u.userData.enemyRing.material.opacity = 0.7 + Math.sin(time * 6 + u.userData.wobble + 1.5) * 0.25;
                }
            });
            // Wave clear: +2 UFOs per wave; at 20 cap speed instead
            if (ufos.length === 0 && ufoScore > 0 && ufoCountdown > 0) {
                ufoWave++;
                ufoCountdown = 10;
                ufoCountdownEl.style.color = '#ff4400';
                const rawSize = 3 + ufoWave * 2;
                const waveSize = Math.min(UFO_MAX, rawSize);
                const hitCap = rawSize >= UFO_MAX;
                if (hitCap) ufoSpeedMult *= 1.5;
                for (let i = 0; i < waveSize; i++) {
                    const u = createUFO();
                    u.userData.speed *= ufoSpeedMult;
                    scene.add(u); ufos.push(u);
                }
                const label = hitCap ? `⚡ WAVE ${ufoWave + 1}! MAX UFOs — SPEED ×${ufoSpeedMult.toFixed(1)}!` : `⚡ WAVE ${ufoWave + 1}! ${waveSize} UFOs!`;
                statusEl.innerHTML = `<span style="color:#ff8800;font-size:13px;letter-spacing:4px;text-shadow:0 0 16px #ff8800">${label}</span>`;
                flashEl.style.transition = 'opacity 0.04s'; flashEl.style.opacity = '0.18';
                setTimeout(() => { flashEl.style.transition = 'opacity 0.4s'; flashEl.style.opacity = '0'; }, 70);
                // From wave 5 onward, add evil kiwis (persistent between waves, +1 each wave)
                if (ufoWave >= 4) {
                    const ekCount = 3 + (ufoWave - 4);
                    for (let i = 0; i < ekCount; i++) { const ek = createEvilKiwi(); scene.add(ek); evilKiwis.push(ek); }
                    if (ufoWave === 4) statusEl.innerHTML = `<span style="color:#ff2200;font-size:13px;letter-spacing:3px;text-shadow:0 0 18px #ff0000">👾 EVIL KIWIS APPEAR! WAVE ${ufoWave + 1}</span>`;
                }
            }
        }

        // Evil kiwi movement — layered sinusoids mimic Perlin-noise wandering
        evilKiwis.forEach(ek => {
            const d = ek.userData;
            const theta = time * d.f1 + d.p1
                + Math.sin(time * d.f2 + d.p2) * 1.4
                + Math.sin(time * d.f3 + d.p3) * 0.7;
            const phi = Math.sin(time * d.f4 + d.p4) * 0.45;
            const r = d.baseR + Math.sin(time * d.f2 + d.p1) * 1.0;
            ek.position.set(
                r * Math.cos(theta) * Math.cos(phi),
                r * Math.sin(phi) * 1.6 + Math.sin(time * d.f1 + d.p3) * 0.6,
                r * Math.sin(theta) * Math.cos(phi)
            );
            ek.rotation.y += dt * 2.2;
            ek.rotation.x = Math.sin(time * d.f2 + d.p2) * 0.4;
            if (d.halo) d.halo.material.opacity = 0.15 + Math.sin(time * 5 + d.p1) * 0.1;
        });

        // Plasma wave rings expand outward then fade
        for (let i = plasmaWaves.length - 1; i >= 0; i--) {
            const pw = plasmaWaves[i];
            pw.t += dt;
            const et = Math.max(0, pw.t - pw.delay);
            const s = 1 + et * 14;
            pw.ring.scale.set(s, s, s);
            pw.mat.opacity = Math.max(0, 1 - et * 1.1);
            if (pw.mat.opacity <= 0) {
                scene.remove(pw.ring);
                pw.ring.geometry.dispose(); pw.mat.dispose();
                plasmaWaves.splice(i, 1);
            }
        }

        if (ufoGamePhase === 'feeding') {
            kiwi.rotation.y += dt * (0.7 + kiwiRadiation * 2.5);
            kiwi.position.y = -1.5 + Math.sin(time * 1.6) * 0.2;
            // Grow and throb more intensely with each fed cake
            const baseS = 0.9 + kiwiRadiation * 1.1;
            kiwi.scale.setScalar(baseS + Math.sin(time * (3 + kiwiRadiation * 8)) * kiwiRadiation * 0.09);
            // Emissive shifts from normal teal → radioactive green
            bodyMat.emissive.setRGB(kiwiRadiation * 0.05, 0.07 + kiwiRadiation * 0.9, kiwiRadiation * 0.15);
            crestMat.emissive.setRGB(0.44 * (1 - kiwiRadiation) + kiwiRadiation * 0.1,
                                     0.13 * (1 - kiwiRadiation) + kiwiRadiation * 0.8,
                                     0.44 * (1 - kiwiRadiation));
            kiwiGlowLight.position.copy(kiwi.position);
            kiwiGlowLight.distance = 14 + kiwi.scale.x * 6;
            kiwiGlowLight.intensity = kiwiRadiation * 42 * (1 + Math.sin(time * (5 + kiwiRadiation * 10)) * 0.45);
            // Quasar jets: appear from first cake, scale and whiten with size
            if (kiwiRadiation >= 0.5) {
                const _js = kiwi.scale.x;
                const _jo = Math.min(0.82, (kiwiRadiation - 0.5) * 0.15);
                const _wh = Math.min(1, (kiwiRadiation - 0.5) * 0.11);
                kiwiJetN.visible = kiwiJetS.visible = true;
                kiwiJetN.position.set(kiwi.position.x, kiwi.position.y + _js * 11, kiwi.position.z);
                kiwiJetS.position.set(kiwi.position.x, kiwi.position.y - _js * 11, kiwi.position.z);
                kiwiJetN.scale.setScalar(_js); kiwiJetS.scale.setScalar(_js);
                [jetMatN, jetMatS].forEach(m => {
                    m.opacity = _jo;
                    m.color.setRGB(0.1 + _wh * 0.9, 1.0, 0.2 + _wh * 0.8);
                });
            }
            // Lens activates only after 20 cakes (kiwiRadiation >= 2)
            const _lensRad = Math.max(0, kiwiRadiation - 2.0);
            if (_lensRad > 0) {
                const _np = kiwi.position.clone().project(camera);
                lensPass.uniforms.center.value.set(_np.x * 0.5 + 0.5, _np.y * 0.5 + 0.5);
                lensPass.uniforms.strength.value = Math.min(0.15, _lensRad * 0.025);
                const _camDist = camera.position.distanceTo(kiwi.position);
                const _fovT = Math.tan(camera.fov * Math.PI / 360);
                // innerR computed from actual projected body size so exclusion always covers kiwimon
                lensPass.uniforms.innerR.value   = Math.min(0.42, (kiwi.scale.x * 2.1) / (_camDist * _fovT * 2.0));
                lensPass.uniforms.radius.value   = Math.min(0.55, 0.14 + kiwi.scale.x * 0.018);
            } else {
                lensPass.uniforms.strength.value = 0;
            }
        } else {
            kiwiGlowLight.intensity = 0;
            lensPass.uniforms.strength.value = 0;
            jetMatN.opacity = 0; jetMatS.opacity = 0;
            kiwiJetN.visible = kiwiJetS.visible = false;
        }

        // Animate laser beams
        for (let i = activeLasers.length - 1; i >= 0; i--) {
            const l = activeLasers[i];
            l.life -= dt * 5.5;
            l.mat.opacity = Math.max(0, l.life);
            l.mat2.opacity = Math.max(0, l.life * 0.45);
            if (l.life <= 0) {
                scene.remove(l.line); scene.remove(l.line2);
                l.geo.dispose(); l.mat.dispose(); l.mat2.dispose();
                activeLasers.splice(i, 1);
            }
        }

        // Animate explosion particles
        for (let i = ufoExplosions.length - 1; i >= 0; i--) {
            const ex = ufoExplosions[i];
            ex.t += dt;
            const pa = ex.geo.attributes.position.array;
            for (let j = 0; j < ex.velocities.length; j++) {
                const v = ex.velocities[j];
                if (v.life > 0) {
                    pa[j*3] += v.x; pa[j*3+1] += v.y; pa[j*3+2] += v.z;
                    v.x *= 0.96; v.y *= 0.96; v.z *= 0.96;
                    v.life -= dt * 1.5;
                }
            }
            ex.geo.attributes.position.needsUpdate = true;
            ex.mat.opacity = Math.max(0, 1 - ex.t * 1.3);
            ex.exLight.intensity = Math.max(0, 40 * Math.exp(-ex.t * 5));
            if (ex.t > 1.5) {
                scene.remove(ex.pts); scene.remove(ex.exLight);
                ex.geo.dispose(); ex.mat.dispose();
                ufoExplosions.splice(i, 1);
            }
        }

        // Animate collected cheesecakes — pop in at orbit position, then float
        collectedCakes.forEach(cake => {
            if (cake.userData.fed || cake.userData.dragging) return;
            cake.userData.emergeT += dt;
            const emerge = Math.min(1, cake.userData.emergeT * 2.2); // fast pop-in (~0.45s)
            const bs = cake.userData.baseScale || 0.55;
            if (emerge < 1) {
                // Scale up in place at orbit position — always visible, never inside BH
                const s = bs * (emerge < 0.5 ? emerge * 2 : 1 - (emerge - 0.5) * 0.4 + 0.4);
                cake.scale.setScalar(Math.max(0.01, s) * 1.1); // slight overshoot then settle
                cake.rotation.y += dt * 4;
            } else {
                // Expand orbit so cakes never clip into a growing kiwimon
                if (ufoGamePhase === 'feeding') {
                    const minR = kiwi.scale.x * 1.65 + 1.5;
                    if (cake.userData.orbitR < minR) cake.userData.orbitR += dt * 4;
                }
                cake.userData.orbitAngle += dt * cake.userData.orbitSpeed;
                cake.position.set(
                    cake.userData.orbitR * Math.cos(cake.userData.orbitAngle),
                    cake.userData.orbitY + Math.sin(time * 1.4 + cake.userData.orbitAngle) * 0.12,
                    cake.userData.orbitR * Math.sin(cake.userData.orbitAngle)
                );
                cake.rotation.y += dt * 0.6;
                cake.scale.setScalar(bs);
            }
        });
        // Transition to egg is now triggered by finishMinigameAndContinue()
    }

    // ── EGG ──────────────────────────────────────────────────────────────────
    if (gameState === 'egg') {
        eggT += dt;

        // grow from singularity
        const es = Math.min(1, eggT * 1.4);
        eggMesh.scale.set(es, es * 1.45, es);
        eggAura.scale.setScalar(es * 1.6);

        // gentle bob + wobble
        eggMesh.position.y = Math.sin(eggT * 1.9) * .2;
        eggAura.position.y = eggMesh.position.y;
        eggMesh.rotation.y += dt * .55;
        eggMesh.rotation.z = Math.sin(eggT * 2.8) * .07;

        // warm pulsing emissive
        const eg = .18 + Math.sin(eggT * 2.5) * .09;
        eggMat.emissive.setRGB(eg * .85, eg * .5, eg * .18);
        eggAuraMat.opacity = .18 + Math.sin(eggT * 2.5) * .1;
    }

    // ── COOKIE DIGIVOLUTION BURST ─────────────────────────────────────────────
    if (gameState === 'cookie-burst') {
        cookieBurstT += dt;

        const cs = Math.min(1, cookieBurstT * 1.7);
        cookieGroup.scale.setScalar(cs);
        cookieAura.scale.setScalar(cs * 2.5);
        cookieGroup.rotation.y += 0.14 * Math.max(0, 1 - cookieBurstT);

        burstLight.intensity  = Math.max(0, 85 * Math.exp(-cookieBurstT * 4.5));
        burstLight2.intensity = Math.max(0, 55 * Math.exp(-cookieBurstT * 2.2));

        shockwaves.forEach(sw => {
            if (!sw.userData.active) return;
            sw.userData.t += dt;
            const s = 1 + sw.userData.t * 13;
            sw.scale.set(s, s, s);
            sw.material.opacity = Math.max(0, 1 - sw.userData.t * 1.6);
            if (sw.material.opacity <= 0) sw.userData.active = false;
        });

        const cpa = burstGeo.attributes.position.array;
        for (let i = 0; i < PCOUNT; i++) {
            if (bVel[i].life > 0) {
                cpa[i * 3]     += bVel[i].x;
                cpa[i * 3 + 1] += bVel[i].y;
                cpa[i * 3 + 2] += bVel[i].z;
                bVel[i].life   -= dt * .6;
            }
        }
        burstGeo.attributes.position.needsUpdate = true;
        burstMat.opacity = Math.max(0, 1 - cookieBurstT * .65);
        beams.forEach(b => { b.material.opacity = Math.max(0, b.material.opacity - dt * .5); });

        if (Math.random() < .07 * Math.max(0, 1 - cookieBurstT)) spawnLightning();

        if (cookieBurstT < .28) {
            const sh = .04 * (1 - cookieBurstT / .28);
            camera.position.x += (Math.random() - .5) * sh;
            camera.position.y += (Math.random() - .5) * sh;
        }

        if (cookieBurstT > 2.1) {
            gameState = 'cookie';
            cookieT = 0;
            burstLight.intensity = burstLight2.intensity = 0;
            burstMat.opacity = 0;
            beams.forEach(b => { b.material.opacity = 0; });
            shockwaves.forEach((sw, i) => { sw.material.color.setHex([0xffffff, 0xff00ff, 0x00ffff][i]); });
            beams.forEach((b, i) => { b.material.color.setHex(i % 2 ? 0xff44ff : 0x44ffff); });
            burstLight2.color.setHex(0xff88ff);
            cookieGroup.scale.setScalar(1);
            cookieAura.scale.setScalar(2.5);
            statusEl.innerHTML = '🍋 LEMON COOKIE ACHIEVED! 🍪';
            comboEl.style.opacity = '0';
            btnEl.textContent = '🔄 RESTART';
            btnEl.style.pointerEvents = 'auto';
            setTimeout(() => showLeaderboard(), 2200);
        }
    }

    // ── COOKIE IDLE ───────────────────────────────────────────────────────────
    if (gameState === 'cookie') {
        cookieT += dt;
        cookieGroup.rotation.y += .009;
        cookieGroup.position.y  = Math.sin(cookieT * 1.3) * .22;
        cookieAura.position.y   = cookieGroup.position.y;

        const cg = .1 + Math.sin(cookieT * 2.2) * .06;
        cookieBaseMat.emissive.setRGB(cg * 1.3, cg * .7, 0);
        cookieGlazeMat.emissive.setRGB(cg * .9, cg * .8, 0);
        cookieAuraMat.opacity = .14 + Math.sin(cookieT * 2.5) * .07;
    }

    // Splash cakes fly outward and fade
    for (let i = splashCakes.length - 1; i >= 0; i--) {
        const sc = splashCakes[i];
        sc.userData.life -= dt * 0.25;
        sc.userData.vel.y -= dt * 0.018;
        sc.userData.vel.multiplyScalar(0.975);
        sc.position.addScaledVector(sc.userData.vel, 1);
        sc.rotation.y += dt * sc.userData.spin;
        sc.rotation.x += dt * sc.userData.spin * 0.4;
        sc.scale.setScalar(Math.max(0.001, (sc.userData.baseScale || 0.55) * sc.userData.life));
        if (sc.userData.life <= 0) { scene.remove(sc); splashCakes.splice(i, 1); }
    }

    composer.render();
}

        osc.connect(g); g.connect(ctx.destination);
        osc.type = 'sine';

        g.gain.setValueAtTime(0.55, t);
