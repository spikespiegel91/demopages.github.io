<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Kiwimon Digivolution</title>
<style>
html,body{
    margin:0;overflow:hidden;
    background:#02030b;
    font-family:'Courier New',monospace;
    cursor:crosshair;user-select:none;
}
canvas{display:block;}

#flash{
    position:fixed;inset:0;
    background:radial-gradient(ellipse at center,#ffffff 0%,#ff88ff 35%,transparent 80%);
    opacity:0;pointer-events:none;z-index:99;
}

#title{
    position:absolute;top:25px;width:100%;text-align:center;
    color:#7df9ff;font-size:28px;letter-spacing:6px;
    text-shadow:0 0 8px #00ffff,0 0 18px #ff00ff;
    pointer-events:none;
}

#hint{
    position:absolute;top:68px;width:100%;text-align:center;
    color:#7df9ff55;font-size:11px;letter-spacing:3px;
    pointer-events:none;opacity:0;transition:opacity 1.2s;
}

#status{
    position:absolute;bottom:88px;width:100%;text-align:center;
    color:#ff8ef5;font-size:13px;letter-spacing:3px;opacity:.85;
    pointer-events:none;
}

#energy-bar{
    position:absolute;bottom:68px;left:50%;transform:translateX(-50%);
    width:220px;height:6px;
    border:1px solid #7df9ff55;border-radius:3px;overflow:hidden;
    box-shadow:0 0 8px #00ffff33;
}

#energy-fill{
    height:100%;width:98%;
    background:linear-gradient(90deg,#00ffff,#ff00ff);
    transition:width .6s,box-shadow .3s;
}

#btn{
    position:absolute;bottom:22px;left:50%;transform:translateX(-50%);
    background:transparent;border:1px solid #ff44ff;
    color:#ff44ff;font-family:'Courier New',monospace;
    font-size:12px;letter-spacing:4px;padding:7px 22px;
    cursor:pointer;text-shadow:0 0 8px #ff00ff;
    box-shadow:0 0 12px #ff00ff44;
    transition:all .25s;outline:none;
}
#btn:hover{background:#ff00ff22;box-shadow:0 0 24px #ff00ffaa;letter-spacing:6px;}
#btn:active{transform:translateX(-50%) scale(.95);}

#combo{
    position:absolute;top:50%;left:50%;
    transform:translate(-50%,-50%) translateY(-90px);
    color:#ffff44;font-size:44px;font-weight:bold;
    letter-spacing:3px;
    text-shadow:0 0 20px #ffff00,0 0 50px #ff8800;
    pointer-events:none;opacity:0;transition:opacity .3s;
}
</style>
</head>
<body>

<div id="flash"></div>
<div id="title">KIWIMON.EXE</div>
<div id="hint">CLICK · DRAG · SCROLL · [SPACE]</div>
<div id="status">DIGIVOLUTION ENERGY: 98%</div>
<div id="energy-bar"><div id="energy-fill"></div></div>
<button id="btn">⚡ DIGIVOLVE</button>
<div id="combo"></div>

<script type="module">
import * as THREE from 'https://unpkg.com/three@0.168.0/build/three.module.js';

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x050510, 0.04);

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 0, 8);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

// ── LIGHTS ──────────────────────────────────────────────────────────────────

scene.add(new THREE.AmbientLight(0x8888ff, 0.8));

const pinkLight = new THREE.PointLight(0xff44ff, 25);
pinkLight.position.set(5, 3, 5);
scene.add(pinkLight);

const cyanLight = new THREE.PointLight(0x00ffff, 18);
cyanLight.position.set(-5, -2, 4);
scene.add(cyanLight);

// burst lights — normally off
const burstLight = new THREE.PointLight(0xffffff, 0, 24);
scene.add(burstLight);

const burstLight2 = new THREE.PointLight(0xff88ff, 0, 18);
burstLight2.position.y = 3;
scene.add(burstLight2);

// ── STARS ────────────────────────────────────────────────────────────────────

const starVerts = [];
for (let i = 0; i < 3000; i++)
    starVerts.push((Math.random() - .5) * 90, (Math.random() - .5) * 90, (Math.random() - .5) * 90);
const starGeo = new THREE.BufferGeometry();
starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starVerts, 3));
const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: .12 });
const starField = new THREE.Points(starGeo, starMat);
scene.add(starField);

// ── GLOW RINGS ───────────────────────────────────────────────────────────────

const rings = [];
for (let i = 0; i < 3; i++) {
    const r = new THREE.Mesh(
        new THREE.TorusGeometry(2 + i * .35, .022, 8, 64),
        new THREE.MeshBasicMaterial({
            color: i % 2 ? 0xff00ff : 0x00ffff,
            transparent: true, opacity: .45,
            blending: THREE.AdditiveBlending, depthWrite: false
        })
    );
    r.rotation.x = Math.PI / 2;
    r.rotation.z = i * .5;
    scene.add(r);
    rings.push(r);
}

// ── KIWIMON ──────────────────────────────────────────────────────────────────

const kiwi = new THREE.Group();
scene.add(kiwi);
kiwi.scale.setScalar(0.001); // hidden — intro burst reveals it

const bodyMat = new THREE.MeshStandardMaterial({ color: 0x55ff99, flatShading: true, emissive: 0x113322 });
kiwi.add(new THREE.Mesh(new THREE.IcosahedronGeometry(1.4, 0), bodyMat));

const belly = new THREE.Mesh(
    new THREE.IcosahedronGeometry(.9, 0),
    new THREE.MeshStandardMaterial({ color: 0xfff8d7, flatShading: true })
);
belly.scale.set(.65, .75, .4);
belly.position.z = .9;
kiwi.add(belly);

[-0.35, 0.35].forEach(x => {
    const e = new THREE.Mesh(new THREE.IcosahedronGeometry(.12, 0), new THREE.MeshBasicMaterial({ color: 0x000000 }));
    e.position.set(x, .25, 1.2);
    kiwi.add(e);
});

const accentMat = new THREE.MeshStandardMaterial({ color: 0xffb040, flatShading: true });
const beakMesh = new THREE.Mesh(new THREE.ConeGeometry(.18, .45, 4), accentMat);
beakMesh.rotation.x = Math.PI / 2;
beakMesh.position.set(0, -.05, 1.45);
kiwi.add(beakMesh);

[-0.45, 0.45].forEach(x => {
    const f = new THREE.Mesh(new THREE.ConeGeometry(.18, .5, 4), accentMat);
    f.position.set(x, -1.45, .25);
    kiwi.add(f);
});

const crestMat = new THREE.MeshStandardMaterial({ color: 0xff33ff, flatShading: true, emissive: 0x440044 });
for (let i = 0; i < 6; i++) {
    const f = new THREE.Mesh(new THREE.ConeGeometry(.12, .5, 4), crestMat);
    f.position.set(0, 1.15, -0.15 + i * .08);
    f.rotation.x = -.6;
    kiwi.add(f);
}

// ── ENERGY ORBS ──────────────────────────────────────────────────────────────

const orbGroup = new THREE.Group();
scene.add(orbGroup);
for (let i = 0; i < 24; i++) {
    const o = new THREE.Mesh(
        new THREE.OctahedronGeometry(.06),
        new THREE.MeshBasicMaterial({
            color: i % 2 ? 0xff00ff : 0x00ffff,
            blending: THREE.AdditiveBlending, depthWrite: false
        })
    );
    o.userData.angle = (i / 24) * Math.PI * 2;
    o.userData.baseR = 2.5;
    orbGroup.add(o);
}

// ── DIGIVOLUTION LIGHT BEAMS ─────────────────────────────────────────────────

const beams = [];
const beamGroup = new THREE.Group();
scene.add(beamGroup);

for (let i = 0; i < 10; i++) {
    const angle = (i / 10) * Math.PI * 2;
    const r = .7 + Math.random() * .7;
    const h = 20 + Math.random() * 6;
    // narrow at base (near kiwi), wide at top — classic digivolution pillar
    const beam = new THREE.Mesh(
        new THREE.CylinderGeometry(.35 + Math.random() * .25, .03, h, 8, 1, true),
        new THREE.MeshBasicMaterial({
            color: i % 2 ? 0xff44ff : 0x44ffff,
            transparent: true, opacity: 0,
            side: THREE.DoubleSide,
            blending: THREE.AdditiveBlending, depthWrite: false
        })
    );
    beam.position.set(Math.cos(angle) * r, h * .5 - 1.5, Math.sin(angle) * r);
    beams.push(beam);
    beamGroup.add(beam);
}

// ── SHOCKWAVE RINGS ───────────────────────────────────────────────────────────

const shockwaves = [];
[0xffffff, 0xff00ff, 0x00ffff].forEach(color => {
    const sw = new THREE.Mesh(
        new THREE.TorusGeometry(1, .07, 8, 64),
        new THREE.MeshBasicMaterial({
            color, transparent: true, opacity: 0,
            blending: THREE.AdditiveBlending, depthWrite: false
        })
    );
    sw.rotation.x = Math.PI / 2;
    sw.userData = { active: false, t: 0 };
    scene.add(sw);
    shockwaves.push(sw);
});

// ── BURST PARTICLES ───────────────────────────────────────────────────────────

const PCOUNT = 220;
const bPos = new Float32Array(PCOUNT * 3);
const bVel = Array.from({ length: PCOUNT }, () => ({ x: 0, y: 0, z: 0, life: 0 }));
const burstGeo = new THREE.BufferGeometry();
burstGeo.setAttribute('position', new THREE.Float32BufferAttribute(bPos, 3));
const burstMat = new THREE.PointsMaterial({
    size: .14, transparent: true, opacity: 0,
    blending: THREE.AdditiveBlending, depthWrite: false
});
burstMat.color.setHex(0xffffff);
const burstParticles = new THREE.Points(burstGeo, burstMat);
scene.add(burstParticles);

// ── LIGHTNING BOLTS ───────────────────────────────────────────────────────────

const lightGroup = new THREE.Group();
scene.add(lightGroup);

function spawnLightning() {
    const end = new THREE.Vector3((Math.random() - .5) * 7, (Math.random() - .5) * 7, (Math.random() - .5) * 7);
    const pts = [];
    for (let i = 0; i <= 10; i++) {
        const p = new THREE.Vector3().lerpVectors(new THREE.Vector3(), end, i / 10);
        if (i > 0 && i < 10) { p.x += (Math.random() - .5) * .7; p.y += (Math.random() - .5) * .7; p.z += (Math.random() - .5) * .7; }
        pts.push(p);
    }
    const geo = new THREE.BufferGeometry().setFromPoints(pts);
    const mat = new THREE.LineBasicMaterial({
        color: Math.random() > .5 ? 0xffffff : 0xff88ff,
        transparent: true, opacity: 1,
        blending: THREE.AdditiveBlending
    });
    const bolt = new THREE.Line(geo, mat);
    lightGroup.add(bolt);
    setTimeout(() => { lightGroup.remove(bolt); geo.dispose(); mat.dispose(); }, 80 + Math.random() * 120);
}

// ── BLACK HOLE ────────────────────────────────────────────────────────────────

const blackHoleGroup = new THREE.Group();
blackHoleGroup.visible = false;
scene.add(blackHoleGroup);

// event horizon
blackHoleGroup.add(new THREE.Mesh(
    new THREE.SphereGeometry(1.2, 32, 32),
    new THREE.MeshBasicMaterial({ color: 0x000000 })
));

// photon sphere backlit rim
blackHoleGroup.add(new THREE.Mesh(
    new THREE.SphereGeometry(1.38, 32, 32),
    new THREE.MeshBasicMaterial({
        color: 0xff5500, transparent: true, opacity: .65,
        blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.BackSide
    })
));

// accretion disk layers — white core out to deep purple
const diskColors = [0xffffff, 0xffcc44, 0xff5500, 0xcc0088];
const diskRadii  = [1.65, 2.05, 2.55, 3.1];
const diskThicks = [0.16, 0.20, 0.19, 0.14];
const diskSpeeds = [2.1, 1.5, 1.0, 0.6];
const diskMeshes = [];
diskColors.forEach((col, i) => {
    const d = new THREE.Mesh(
        new THREE.TorusGeometry(diskRadii[i], diskThicks[i], 12, 120),
        new THREE.MeshBasicMaterial({
            color: col, transparent: true, opacity: .95 - i * .18,
            blending: THREE.AdditiveBlending, depthWrite: false
        })
    );
    d.rotation.x = Math.PI / 2;
    d.rotation.z = i * .15;
    blackHoleGroup.add(d);
    diskMeshes.push(d);
});

// relativistic jets (north + south poles)
[-1, 1].forEach(dir => {
    const jet = new THREE.Mesh(
        new THREE.CylinderGeometry(dir > 0 ? .22 : .04, dir > 0 ? .04 : .22, 18, 8, 1, true),
        new THREE.MeshBasicMaterial({
            color: 0x8899ff, transparent: true, opacity: .5,
            side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false
        })
    );
    jet.position.y = dir * 9;
    blackHoleGroup.add(jet);
});

// gravitational lens rings at tilted planes
[[3.2, .1, .28], [4.3, .06, -.45], [5.6, .05, .18]].forEach(([r, t, tilt], i) => {
    const lr = new THREE.Mesh(
        new THREE.TorusGeometry(r, t, 8, 80),
        new THREE.MeshBasicMaterial({
            color: [0xff8800, 0xcc00ff, 0x0088ff][i],
            transparent: true, opacity: .4,
            blending: THREE.AdditiveBlending, depthWrite: false
        })
    );
    lr.rotation.x = Math.PI / 2 + tilt;
    lr.rotation.z = tilt * 1.5;
    blackHoleGroup.add(lr);
});

const bhLight = new THREE.PointLight(0xff4400, 0, 22);
scene.add(bhLight);

// ── EGG ──────────────────────────────────────────────────────────────────────

const eggMat = new THREE.MeshStandardMaterial({ color: 0xfff0e0, flatShading: true, emissive: 0x441100 });
const eggMesh = new THREE.Mesh(new THREE.IcosahedronGeometry(1.0, 1), eggMat);
eggMesh.scale.set(1, 1.45, 1);
eggMesh.visible = false;
scene.add(eggMesh);

const eggAuraMat = new THREE.MeshBasicMaterial({
    color: 0xffddaa, transparent: true, opacity: .25,
    blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.BackSide
});
const eggAura = new THREE.Mesh(new THREE.SphereGeometry(1.6, 16, 16), eggAuraMat);
eggAura.visible = false;
scene.add(eggAura);

// ── ORBIT CAMERA ──────────────────────────────────────────────────────────────

let orbitActive = false, orbitLastX = 0, orbitLastY = 0;
let orbitTheta = 0, orbitPhi = Math.PI * .45, orbitRadius = 8;
let mouseDownX = 0, mouseDownY = 0, didDrag = false;

renderer.domElement.addEventListener('mousedown', e => {
    orbitActive = true; didDrag = false;
    orbitLastX = mouseDownX = e.clientX;
    orbitLastY = mouseDownY = e.clientY;
});
window.addEventListener('mouseup', () => { orbitActive = false; });
window.addEventListener('mousemove', e => {
    if (!orbitActive) return;
    if (Math.hypot(e.clientX - mouseDownX, e.clientY - mouseDownY) > 5) didDrag = true;
    const dx = e.clientX - orbitLastX, dy = e.clientY - orbitLastY;
    orbitLastX = e.clientX; orbitLastY = e.clientY;
    orbitTheta -= dx * .005;
    orbitPhi = Math.max(.1, Math.min(Math.PI - .1, orbitPhi - dy * .005));
});
renderer.domElement.addEventListener('wheel', e => {
    orbitRadius = Math.max(3, Math.min(18, orbitRadius + e.deltaY * .01));
}, { passive: true });
renderer.domElement.addEventListener('click', () => { if (!didDrag) triggerBurst(); });
window.addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); triggerBurst(); } });

// touch
let touchSX = 0, touchSY = 0, touchDragged = false;
renderer.domElement.addEventListener('touchstart', e => {
    touchSX = orbitLastX = e.touches[0].clientX;
    touchSY = orbitLastY = e.touches[0].clientY;
    orbitActive = true; touchDragged = false;
}, { passive: true });
renderer.domElement.addEventListener('touchmove', e => {
    if (!orbitActive) return;
    if (Math.hypot(e.touches[0].clientX - touchSX, e.touches[0].clientY - touchSY) > 5) touchDragged = true;
    const dx = e.touches[0].clientX - orbitLastX, dy = e.touches[0].clientY - orbitLastY;
    orbitLastX = e.touches[0].clientX; orbitLastY = e.touches[0].clientY;
    orbitTheta -= dx * .005;
    orbitPhi = Math.max(.1, Math.min(Math.PI - .1, orbitPhi - dy * .005));
}, { passive: true });
renderer.domElement.addEventListener('touchend', () => {
    orbitActive = false;
    if (!touchDragged) triggerBurst();
}, { passive: true });

// ── BURST STATE ───────────────────────────────────────────────────────────────

let burstActive = false, burstT = 0;
let introComplete = false;
let comboCount = 0, comboTimer = 0;
let gameState = 'normal'; // 'normal' | 'ultra-burst' | 'blackhole' | 'egg'
let ultraT = 0, bhT = 0, eggT = 0;

const flashEl  = document.getElementById('flash');
const statusEl = document.getElementById('status');
const fillEl   = document.getElementById('energy-fill');
const comboEl  = document.getElementById('combo');
const btnEl    = document.getElementById('btn');
const hintEl   = document.getElementById('hint');

function triggerBurst() {
    // state guards
    if (gameState === 'ultra-burst' || gameState === 'blackhole') return;
    if (gameState === 'egg') { hatchEgg(); return; }

    // advance combo before anything else
    comboCount++;
    comboTimer = 2.8;

    // ⚡ ULTRA trigger at combo ×10
    if (comboCount >= 10 && introComplete) { triggerUltraBurst(); return; }

    burstActive = true;
    burstT = 0;

    // screen flash
    flashEl.style.transition = 'opacity 0.04s';
    flashEl.style.opacity = '.92';
    setTimeout(() => { flashEl.style.transition = 'opacity 0.85s'; flashEl.style.opacity = '0'; }, 65);

    statusEl.innerHTML = 'DIGIVOLUTION SEQUENCE: <span style="color:#ffff44;text-shadow:0 0 8px #ff0">ACTIVE ⚡</span>';
    fillEl.style.width = '100%';
    fillEl.style.boxShadow = '0 0 16px #ffffff, 0 0 8px #ff00ff';

    // staggered shockwaves
    shockwaves.forEach((sw, i) => {
        setTimeout(() => {
            sw.scale.set(.01, .01, .01);
            sw.material.opacity = 1;
            sw.userData.active = true;
            sw.userData.t = 0;
        }, i * 140);
    });

    // particles
    const pa = burstGeo.attributes.position.array;
    for (let i = 0; i < PCOUNT; i++) {
        pa[i * 3] = pa[i * 3 + 1] = pa[i * 3 + 2] = 0;
        const speed = .05 + Math.random() * .13;
        const th = Math.random() * Math.PI * 2;
        const ph = Math.random() * Math.PI;
        bVel[i] = {
            x: Math.sin(ph) * Math.cos(th) * speed,
            y: Math.sin(ph) * Math.sin(th) * speed + .035,
            z: Math.cos(ph) * speed,
            life: 1
        };
    }
    burstGeo.attributes.position.needsUpdate = true;
    burstMat.opacity = 1;

    // beams stagger in
    beams.forEach((b, i) => setTimeout(() => { b.material.opacity = .5 + Math.random() * .35; }, i * 22));

    // lightning volley
    for (let i = 0; i < 14; i++) setTimeout(() => spawnLightning(), i * 38);

    // combo display
    if (comboCount > 1) {
        comboEl.style.color = '#ffff44';
        comboEl.style.textShadow = '0 0 20px #ffff00, 0 0 40px #ff8800';
        comboEl.style.fontSize = '44px';
        comboEl.textContent = `COMBO ×${comboCount}`;
        comboEl.style.opacity = '1';
    }

    btnEl.textContent = '⚡ DIGIVOLVING...';
    btnEl.style.pointerEvents = 'none';
}

document.getElementById('btn').addEventListener('click', () => triggerBurst());

function triggerUltraBurst() {
    gameState = 'ultra-burst';
    ultraT = 0;
    // cancel any ongoing normal burst cleanly
    burstActive = false;
    beams.forEach(b => { b.material.opacity = 0; });
    burstMat.opacity = 0;
    shockwaves.forEach(sw => { sw.userData.active = false; sw.material.opacity = 0; });

    // catastrophic flash
    flashEl.style.transition = 'opacity 0.02s';
    flashEl.style.opacity = '1';
    setTimeout(() => { flashEl.style.transition = 'opacity 1.8s'; flashEl.style.opacity = '0'; }, 100);

    statusEl.innerHTML = '<span style="color:#ff2200;font-size:15px;letter-spacing:5px;text-shadow:0 0 20px #ff0000,0 0 50px #ff6600">⚠ ULTRA DIGIVOLVE ⚠</span>';
    fillEl.style.width = '100%';
    fillEl.style.boxShadow = '0 0 40px #ffffff, 0 0 80px #ffff00';

    comboEl.style.color = '#ff2200';
    comboEl.style.fontSize = '38px';
    comboEl.style.textShadow = '0 0 30px #ff0000, 0 0 70px #ff6600';
    comboEl.textContent = '× 10  U L T R A !!';
    comboEl.style.opacity = '1';

    // lightning storm
    for (let i = 0; i < 30; i++) setTimeout(() => spawnLightning(), i * 22);

    btnEl.textContent = '💀 EVOLVING...';
    btnEl.style.pointerEvents = 'none';
}

function hatchEgg() {
    comboCount = 0;
    comboTimer = 0;
    gameState = 'normal';
    introComplete = false;

    eggMesh.visible = false;
    eggAura.visible = false;
    kiwi.visible = true;
    kiwi.scale.setScalar(0.001);
    orbGroup.children.forEach(o => { o.userData.baseR = 2.5; });

    flashEl.style.transition = 'opacity 0.04s';
    flashEl.style.opacity = '.9';
    setTimeout(() => { flashEl.style.transition = 'opacity 0.8s'; flashEl.style.opacity = '0'; }, 65);

    comboEl.style.opacity = '0';
    comboEl.style.color = '#ffff44';
    comboEl.style.textShadow = '0 0 20px #ffff00, 0 0 40px #ff8800';
    comboEl.style.fontSize = '44px';

    statusEl.textContent = 'HATCHING...';
    btnEl.textContent = '⚡ DIGIVOLVE';
    btnEl.style.pointerEvents = 'none';

    // small delay then run the intro burst
    setTimeout(() => triggerBurst(), 400);
}

// ── RESIZE ───────────────────────────────────────────────────────────────────

window.addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
});

// ── ANIMATE ──────────────────────────────────────────────────────────────────

let lastFrameTime = performance.now();

function animate(t) {
    requestAnimationFrame(animate);
    const dt = Math.min((t - lastFrameTime) * .001, .05);
    lastFrameTime = t;
    const time = t * .001;

    // orbit camera
    camera.position.set(
        orbitRadius * Math.sin(orbitPhi) * Math.sin(orbitTheta),
        orbitRadius * Math.cos(orbitPhi),
        orbitRadius * Math.sin(orbitPhi) * Math.cos(orbitTheta)
    );
    camera.lookAt(0, 0, 0);

    // idle animation (only in normal state after intro)
    if (introComplete && gameState === 'normal') {
        kiwi.rotation.y += .01;
        kiwi.rotation.x = Math.sin(time * .7) * .08;
        kiwi.position.y  = Math.sin(time * 1.4) * .35;
        // subtle living emissive pulse
        const idleG = .07 + Math.sin(time * 1.6) * .03;
        bodyMat.emissive.setRGB(idleG * .45, idleG, idleG * .55);
        crestMat.emissive.setRGB(idleG * 1.2, idleG * .3, idleG * 1.2);
    }

    starField.rotation.y += .0004;

    orbGroup.rotation.y += .02;
    orbGroup.children.forEach((o, i) => {
        const a = o.userData.angle + time;
        const r = o.userData.baseR + Math.sin(time * 3 + i) * .15;
        o.position.set(Math.cos(a) * r, Math.sin(a * 2) * .8, Math.sin(a) * r);
    });

    rings.forEach(r => { r.rotation.z += .003; });

    pinkLight.intensity = 20 + Math.sin(time * 2)     * 8;
    cyanLight.intensity = 15 + Math.sin(time * 2.5 + 1) * 6;

    // combo timer decay (only reset in normal state)
    if (comboTimer > 0) {
        comboTimer -= dt;
        if (comboTimer <= 0 && gameState === 'normal') { comboCount = 0; comboEl.style.opacity = '0'; }
    }

    // ── BURST ANIMATION ──────────────────────────────────────────────────────
    if (burstActive) {
        burstT += dt * .72;

        // explosive lights
        burstLight.intensity  = Math.max(0, 95  * Math.exp(-burstT * 4.5));
        burstLight2.intensity = Math.max(0, 58  * Math.exp(-burstT * 2.2));

        // shockwave expansion
        shockwaves.forEach(sw => {
            if (!sw.userData.active) return;
            sw.userData.t += dt;
            const s = 1 + sw.userData.t * 13;
            sw.scale.set(s, s, s);
            sw.material.opacity = Math.max(0, 1 - sw.userData.t * 1.6);
            if (sw.material.opacity <= 0) sw.userData.active = false;
        });

        // particles fly outward
        const pa = burstGeo.attributes.position.array;
        for (let i = 0; i < PCOUNT; i++) {
            if (bVel[i].life > 0) {
                pa[i * 3]     += bVel[i].x;
                pa[i * 3 + 1] += bVel[i].y;
                pa[i * 3 + 2] += bVel[i].z;
                bVel[i].life  -= dt * .6;
            }
        }
        burstGeo.attributes.position.needsUpdate = true;
        burstMat.opacity = Math.max(0, 1 - burstT * .65);
        burstMat.color.setHex(burstT < .35 ? 0xffffff : 0xffaaff);

        // beams fade out slowly
        beams.forEach(b => { b.material.opacity = Math.max(0, b.material.opacity - dt * .5); });

        // kiwimon intro scale-up, then pulse
        if (!introComplete) {
            const s = Math.min(1, burstT * 1.6);
            kiwi.scale.setScalar(s);
            kiwi.rotation.y += .14;
            if (s >= .99) {
                introComplete = true;
                kiwi.scale.setScalar(1);
                hintEl.style.opacity = '1';
            }
        } else {
            kiwi.scale.setScalar(1 + Math.max(0, .22 * Math.sin(burstT * 22) * (1 - burstT)));
            kiwi.rotation.y += Math.max(0, .14 * (1 - burstT * 1.8));
        }

        // screen shake at impact
        if (burstT < .28) {
            const sh = .045 * (1 - burstT / .28);
            camera.position.x += (Math.random() - .5) * sh;
            camera.position.y += (Math.random() - .5) * sh;
        }

        // body + crest glow flare
        const glow = Math.max(0, 1 - burstT * 1.7);
        bodyMat.emissive.setRGB(glow * .4, glow, glow * .5);
        crestMat.emissive.setRGB(glow, glow * .28, glow);

        // occasional residual lightning
        if (Math.random() < .09 * Math.max(0, 1 - burstT)) spawnLightning();

        // orbs burst outward then snap back
        orbGroup.children.forEach(o => {
            if (burstT < .45) o.userData.baseR = 2.5 + (1 - burstT * 2.2) * 2.2;
            else o.userData.baseR = Math.max(2.5, o.userData.baseR - dt * 2.5);
        });

        // star size flare
        starMat.size = .12 + Math.max(0, 1 - burstT * 3) * .1;

        // end burst
        if (burstT > 2.1) {
            burstActive = false;
            burstLight.intensity = burstLight2.intensity = 0;
            burstMat.opacity = 0;
            beams.forEach(b => { b.material.opacity = 0; });
            bodyMat.emissive.setHex(0x113322);
            crestMat.emissive.setHex(0x440044);
            kiwi.scale.setScalar(1);
            starMat.size = .12;
            orbGroup.children.forEach(o => { o.userData.baseR = 2.5; });
            statusEl.textContent = 'DIGIVOLUTION COMPLETE ✓';
            fillEl.style.width = '100%';
            fillEl.style.boxShadow = '0 0 6px #ff00ff';
            btnEl.textContent = '⚡ DIGIVOLVE';
            btnEl.style.pointerEvents = 'auto';
            setTimeout(() => {
                statusEl.textContent = 'DIGIVOLUTION ENERGY: 98%';
                fillEl.style.width = '98%';
            }, 2000);
        }
    }

    // ── ULTRA-BURST ───────────────────────────────────────────────────────────
    if (gameState === 'ultra-burst') {
        ultraT += dt;

        // kiwimon spins violently and swells
        kiwi.rotation.y += ultraT * .3;
        kiwi.scale.setScalar(1 + ultraT * .4);
        kiwi.position.y = Math.sin(time * 12) * .08;

        // rapid emissive flicker
        const fl = Math.sin(ultraT * 55) > 0;
        bodyMat.emissive.setRGB(fl ? 1 : .1, fl ? .05 : 1, fl ? .4 : .4);
        crestMat.emissive.setRGB(fl ? 1 : 0, fl ? .4 : 0, fl ? 0 : 1);

        // orbs spiral inward
        orbGroup.children.forEach(o => { o.userData.baseR = Math.max(0, o.userData.baseR - dt * 2.2); });

        // burst lights thrash
        burstLight.intensity  = 50 + Math.sin(ultraT * 25) * 40;
        burstLight2.intensity = 30 + Math.sin(ultraT * 18) * 25;

        if (Math.random() < .2) spawnLightning();

        // collapse: hide kiwimon, reveal black hole
        if (ultraT > 1.9) {
            flashEl.style.transition = 'opacity 0.03s';
            flashEl.style.opacity = '1';
            setTimeout(() => { flashEl.style.transition = 'opacity 3s'; flashEl.style.opacity = '0'; }, 90);

            kiwi.visible = false;
            kiwi.scale.setScalar(1);
            kiwi.position.set(0, 0, 0);
            kiwi.rotation.set(0, 0, 0);
            bodyMat.emissive.setHex(0x113322);
            crestMat.emissive.setHex(0x440044);
            burstLight.intensity = burstLight2.intensity = 0;

            blackHoleGroup.visible = true;
            blackHoleGroup.scale.setScalar(.02);
            blackHoleGroup.rotation.set(0, 0, 0);
            bhLight.intensity = 70;
            // orbs reset to spiral into BH
            orbGroup.children.forEach(o => { o.userData.baseR = .4 + Math.random() * 2.5; });

            gameState = 'blackhole';
            bhT = 0;
            statusEl.innerHTML = '<span style="color:#ff4400;text-shadow:0 0 12px #ff4400">EVENT HORIZON FORMED</span>';
        }
    }

    // ── BLACK HOLE ────────────────────────────────────────────────────────────
    if (gameState === 'blackhole') {
        bhT += dt;

        // scale up from singularity
        blackHoleGroup.scale.setScalar(Math.min(1, bhT * 1.6));
        blackHoleGroup.rotation.y += dt * .22;

        // accretion disks spin at different speeds/directions
        diskMeshes.forEach((d, i) => {
            d.rotation.z += dt * diskSpeeds[i] * (i % 2 ? 1 : -1);
        });

        // light transitions orange → purple over time
        bhLight.intensity = Math.max(18, 70 * Math.exp(-bhT * .6)) + Math.sin(bhT * 3) * 8;
        bhLight.color.setHex(bhT < 2 ? 0xff4400 : 0xaa00ff);

        // orbs spiral into event horizon with increasing angular speed
        orbGroup.children.forEach(o => {
            if (o.userData.baseR > 0) {
                const pull = .35 + (2.5 - Math.min(2.5, o.userData.baseR)) * .55;
                o.userData.baseR = Math.max(0, o.userData.baseR - dt * pull);
                o.userData.angle += dt * (2.5 - o.userData.baseR) * 1.4;
            }
        });

        if (Math.random() < .05) spawnLightning();

        // collapse black hole → spawn egg
        if (bhT > 4.2) {
            flashEl.style.transition = 'opacity 0.04s';
            flashEl.style.opacity = '.8';
            setTimeout(() => { flashEl.style.transition = 'opacity 2.2s'; flashEl.style.opacity = '0'; }, 70);

            blackHoleGroup.visible = false;
            bhLight.intensity = 0;

            eggMesh.visible = true;
            eggAura.visible = true;
            eggMesh.scale.set(.01, .015, .01);
            eggMesh.position.set(0, 0, 0);
            eggMesh.rotation.set(0, 0, 0);
            eggAura.scale.setScalar(.01);
            eggAura.position.set(0, 0, 0);

            orbGroup.children.forEach(o => { o.userData.baseR = 2.5; });

            gameState = 'egg';
            eggT = 0;
            comboCount = 0;
            comboTimer = 0;
            comboEl.style.opacity = '0';

            statusEl.textContent = 'A NEW EGG HAS APPEARED...';
            setTimeout(() => { if (gameState === 'egg') statusEl.textContent = 'CLICK TO HATCH'; }, 2800);
            btnEl.textContent = '🥚 HATCH';
            btnEl.style.pointerEvents = 'auto';
        }
    }

    // ── EGG ──────────────────────────────────────────────────────────────────
    if (gameState === 'egg') {
        eggT += dt;

        // grow from singularity
        const es = Math.min(1, eggT * 1.4);
        eggMesh.scale.set(es, es * 1.45, es);
        eggAura.scale.setScalar(es * 1.6);

        // gentle bob + wobble
        eggMesh.position.y = Math.sin(eggT * 1.9) * .2;
        eggAura.position.y = eggMesh.position.y;
        eggMesh.rotation.y += dt * .55;
        eggMesh.rotation.z = Math.sin(eggT * 2.8) * .07;

        // warm pulsing emissive
        const eg = .18 + Math.sin(eggT * 2.5) * .09;
        eggMat.emissive.setRGB(eg * .85, eg * .5, eg * .18);
        eggAuraMat.opacity = .18 + Math.sin(eggT * 2.5) * .1;
    }

    renderer.render(scene, camera);
}

requestAnimationFrame(animate);

// intro digivolution burst after 1.5s
setTimeout(() => triggerBurst(), 1500);

</script>
</body>
